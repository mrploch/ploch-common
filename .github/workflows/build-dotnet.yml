# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
env:
  SONAR_PROJECT_KEY: mrploch_ploch-common
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - run: echo "The branch name is ${{ github.repository }}"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development

      # Setup Java (required for SonarScanner)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      # For PR builds, embed the PR number and branch name in the prerelease tag
      # so packages are clearly identifiable (e.g. 3.1.1-pr.42.fix-serialization)
      - name: Configure PR package version
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          # Sanitize branch name for NuGet SemVer2 prerelease identifiers [a-zA-Z0-9-]
          SANITIZED=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-20 | sed 's/-$//')
          # Guard against empty or purely-numeric identifiers (invalid in SemVer2)
          if [ -z "$SANITIZED" ]; then
            SANITIZED="branch"
          fi
          if echo "$SANITIZED" | grep -Eq '^[0-9]+$'; then
            SANITIZED="b-${SANITIZED}"
          fi
          # Read current major.minor from NBGV
          CURRENT_VERSION=$(dotnet nbgv get-version --variable SimpleVersion)
          BASE=$(echo "$CURRENT_VERSION" | cut -d. -f1-2)
          # Override the prerelease tag to include PR number and branch name
          dotnet nbgv set-version "${BASE}-pr.${PR_NUMBER}.${SANITIZED}"
          # NBGV reads version.json from the committed git state, so we must
          # commit the change for it to take effect. This ephemeral commit is
          # never pushed — it only exists on the CI runner.
          git add version.json
          git -c user.name="ci" -c user.email="ci@ci" commit -m "ci: PR version" --no-verify
          COMPUTED=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "PR NuGet package version: $COMPUTED"

      # Restore
      - name: Restore dependencies
        id: restore
        run: dotnet restore ./Ploch.Common.slnx

      # Capture the NBGV-computed package version so SonarScanner can pass it
      # as sonar.projectVersion. Without this, the "Previous version" new-code
      # definition has no version history to diff against and treats the
      # entire baseline as new code on every analysis. See issue #222.
      - name: Get NBGV version for SonarCloud
        id: nbgv-version
        run: |
          NUGET_VERSION=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget_version=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "SonarCloud project version: $NUGET_VERSION"

      # SonarCloud analysis.
      #
      # These steps are no longer masked with continue-on-error: a genuine
      # analysis failure must fail the build, otherwise a silently-skipped
      # analysis reads as a passing one and the completion gate in
      # .claude/rules/pr-checks-completion-gate.md is meaningless.
      #
      # GitHub withholds secrets from pull requests raised from forks and from
      # those authored by Dependabot (whose branch lives in this repository, so
      # a head.repo test alone does not detect it). The scanner steps are
      # skipped rather than failed in those cases; Build and Test always run.
      - name: Determine SonarCloud eligibility
        id: sonar-eligibility
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          IS_UPSTREAM_REPO: ${{ github.repository == 'mrploch/ploch-common' }}
          SECRETS_WITHHELD: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          # A fork's own push and workflow_dispatch runs are not pull requests, so
          # SECRETS_WITHHELD does not cover them and they would otherwise reach the
          # error branch below. Skip outright outside the upstream repository: the
          # project key is upstream's, so a fork could not usefully analyse into it
          # even if it supplied its own token.
          if [ "$IS_UPSTREAM_REPO" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not running in mrploch/ploch-common; skipping SonarCloud analysis. Build and test still run."
          # Strip all whitespace, not just literal spaces, so a token that is
          # only tabs or newlines is correctly treated as absent.
          elif [ -n "$(printf '%s' "$SONAR_TOKEN" | tr -d '[:space:]')" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SonarCloud token available; analysis enabled."
          elif [ "$SECRETS_WITHHELD" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No SonarCloud token is available on this pull request (raised from a fork, or authored by Dependabot). Skipping SonarCloud analysis; build and test still run."
          else
            echo "::error::SONAR_TOKEN is empty on a run that should have access to it. SonarCloud analysis would run anonymously and then fail post-processing with a misleading 'Not authorized or project not found'."
            exit 1
          fi
      - name: Install SonarCloud Scanner
        if: steps.sonar-eligibility.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-sonarscanner
      - name: Install dotnet-coverage
        if: steps.sonar-eligibility.outputs.enabled == 'true'
        run: dotnet tool install --global dotnet-coverage
      - name: SonarScanner Begin
        id: sonar-begin
        if: steps.sonar-eligibility.outputs.enabled == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT_KEY }}"
          /o:"${{ env.SONAR_ORGANIZATION }}"
          /v:"${{ steps.nbgv-version.outputs.nuget_version }}"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.projectBaseDir="${{ github.workspace }}"
          /d:sonar.scm.provider=git
          /d:sonar.cs.opencover.reportsPaths=**/CoverageResults/coverage*.opencover.xml
          /d:sonar.coverage.exclusions="**/*.ps1,**/JetbrainsAnnotations.cs,**/*.Tests/**,**/*.Tests.csproj,scripts/**,**/TestAssemblies/**"

      # Build and Test run regardless of SonarCloud status.
      #
      # !cancelled() is load-bearing: without it, a failed eligibility check or
      # a failed scanner install/begin would halt the job and skip these steps,
      # losing the compile-and-test signal because of an ancillary tool. The
      # Sonar failure still fails the job overall — it just no longer suppresses
      # the result that matters most. This preserves the property the previous
      # continue-on-error gave us, without also hiding genuine Sonar failures.
      #
      # It is paired with an explicit prerequisite check rather than left bare:
      # !cancelled() also overrides the implicit success() for *every* earlier
      # step, so on its own it would run Build after a failed checkout, .NET
      # setup or restore, producing noise instead of a compile signal. Gating on
      # steps.restore.outcome keeps Build tied to what it actually needs — that
      # step is skipped if any earlier prerequisite failed — while leaving it
      # independent of everything in the Sonar block.
      #
      # Consequence for future edits: because the gate names its prerequisite
      # explicitly, a new step inserted between Restore and Build will NOT halt
      # Build if it fails. Any step Build genuinely depends on must be given an
      # id and added to this condition.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet build ./Ploch.Common.slnx --no-restore -c Release
      # Test uses --no-build, so without this gate a failed Build produces a second,
      # more confusing failure about missing assemblies instead of the compile error.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test ./Ploch.Common.slnx --verbosity normal --no-build -c Release --logger "trx;LogFileName=TestOutputResults.trx" /p:CollectCoverage=true /p:CoverletOutput=./CoverageResults/ "/p:CoverletOutputFormat=cobertura%2copencover"

      # SonarCloud end (runs even after test failures, only if begin succeeded)
      - name: SonarScanner End
        if: ${{ !cancelled() && steps.sonar-begin.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Run codacy-coverage-reporter
        if: always()
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: '**/CoverageResults/coverage*.opencover.xml'
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.xml
            **/TestResults/*.trx
      - name: Test Report
        uses: phoenix-actions/test-reporting@v8
        id: test-report
        if: always()
        continue-on-error: true
        with:
          name: Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            **/CoverageResults/*.xml
      # Smoke-test the docs build on PRs (non-blocking). Deployment happens in publish-docs.yml.
      # `continue-on-error` is retained until #190 tightens the build with --warningsAsErrors.
      - name: Build documentation (smoke test)
        id: docfx
        if: always()
        continue-on-error: true
        run: dotnet docfx DocumentationSite/docfx.json

      # Publish prerelease NuGet packages to GitHub Packages
      # Release packages are published to nuget.org via the release workflow
      - name: Add GitHub Packages source
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          IS_UPSTREAM_REPO: ${{ github.repository == 'mrploch/ploch-common' }}
        run: |
          # A fork's own master/main push reaches this step now that the SonarCloud
          # eligibility check skips instead of failing there, so success() stays true.
          # The repository check comes first, mirroring that step: the feed below is
          # upstream's, so a fork must not publish into it even when it supplies its
          # own GH_PACKAGES_TOKEN. Upstream, a missing token is a misconfiguration and
          # must fail loudly - silently skipping it is the masking this branch removes.
          if [ "$IS_UPSTREAM_REPO" != "true" ]; then
            echo "::warning::Not running in mrploch/ploch-common; skipping GitHub Packages source setup."
            exit 0
          fi
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty on a push to upstream master/main. Prerelease packages cannot be published to GitHub Packages."
            exit 1
          fi
          dotnet nuget add source --username kploch --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/mrploch/index.json"
      - name: Publish NuGet packages to GitHub Packages
        if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          IS_UPSTREAM_REPO: ${{ github.repository == 'mrploch/ploch-common' }}
        run: |
          # Same guard as the source step above, in the same order. Both branches are
          # unreachable in practice - the source step skips or fails first, so this
          # step is only entered upstream with a token - but the two are kept
          # symmetrical so neither can be read as the lenient one.
          if [ "$IS_UPSTREAM_REPO" != "true" ]; then
            echo "::warning::Not running in mrploch/ploch-common; skipping prerelease package publish."
            exit 0
          fi
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::GH_PACKAGES_TOKEN is empty on a push to upstream master/main. Prerelease packages cannot be published to GitHub Packages."
            exit 1
          fi
          dotnet nuget push ./**/*.nupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN"
          dotnet nuget push ./**/*.snupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN" || true

      # Publish PR packages to GitHub Packages for testing/validation
      # PR packages include branch name in the prerelease tag (configured above)
      - name: Publish PR packages to GitHub Packages
        if: success() && github.event_name == 'pull_request'
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::warning::GH_PACKAGES_TOKEN not available, skipping PR package publish"
            exit 0
          fi
          dotnet nuget add source --username kploch --password "$GH_PACKAGES_TOKEN" --store-password-in-clear-text --name github "https://nuget.pkg.github.com/mrploch/index.json"
          dotnet nuget push ./**/*.nupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN"
          dotnet nuget push ./**/*.snupkg --source github --skip-duplicate -k "$GH_PACKAGES_TOKEN" || true
