# Builds the DocFX site, deploys it to GitHub Pages on master, and publishes an
# isolated per-pull-request preview so a reviewer can judge a docs change before it
# is merged (#201).
#
# WHY THE PREVIEW LIVES HERE AND NOT IN ITS OWN WORKFLOW
# ------------------------------------------------------
# #201 was first implemented as a separate `docs-preview.yml` that built the site
# itself. #330 then added a `pull_request` trigger to this workflow, so the site was
# being built twice on the same commit for the same output - and the two copies had
# already drifted apart in a way that mattered: the preview still passed
# `--warningsAsErrors` to `docfx metadata`, the exact flag #330 had to remove because
# DocFX 2.78.5 always emits workspace warnings on the Linux runner (#329). A second
# copy of the build is not merely wasteful; it is a copy that goes stale silently.
# So there is one build job, and the preview jobs consume its artifact.
#
# ISOLATION (the hard requirement of #201)
# ----------------------------------------
# Production is deployed by `deploy-docs` through actions/upload-pages-artifact +
# actions/deploy-pages, which needs `pages: write` and `id-token: write`. Neither
# permission is granted to `publish-preview` or `comment-preview`, so a mistake in a
# preview job is *technically incapable* of creating a GitHub Pages deployment and
# cannot overwrite https://github.ploch.dev/ploch-common/. `deploy-docs` in turn is
# gated on `github.event_name != 'pull_request'`, so a pull request never reaches it.
# The preview jobs only ever write into `pr-preview/pr-<N>/` on a dedicated preview
# branch that production never reads.
#
# The branch write is a separate concern from the Pages deployment, and it is *not*
# protected by the token: `contents: write` can write any branch. The preview branch
# name is therefore validated against a reserved list before anything is pushed - see
# the safety gate in "Publish preview to the preview branch", and the identical one in
# docs-preview-cleanup.yml.
#
# FORKS AND DEPENDABOT
# --------------------
# GitHub withholds write access and secrets from pull requests raised from forks and
# from those authored by Dependabot (whose branch lives in this repository, so a
# head.repo test alone does not detect it). Rather than reach for pull_request_target
# - which would run with a write token against untrusted code - the work is split:
# `build-docs` needs only `contents: read` and therefore runs for everybody, giving
# fork PRs the same build/validation signal; `publish-preview` carries the write
# permission and is skipped, with a notice rather than an error, whenever the token
# cannot support it. This mirrors the "Determine SonarCloud eligibility" step in
# build-dotnet.yml.
#
# HOSTING
# -------
# A repository has exactly one GitHub Pages site, and this repository's is fed by the
# production artifact, so a preview branch is not served automatically. The hosted
# lane is therefore opt-in: set the repository variables DOCS_PREVIEW_BASE_URL (and
# optionally DOCS_PREVIEW_BRANCH) once a Pages site is pointed at the preview branch.
# Until then every pull request still gets a build and a comment linking the
# downloadable site artifact, so nothing here posts a URL that does not resolve.
name: Publish Docs

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull request validation runs are keyed per-ref so they neither queue behind nor block a Pages deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # Checking out and building the site needs nothing but the repository contents.
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.names.outputs.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # NBGV needs full history

      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET tools (docfx is pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Compute preview artifact name
        # Computed before the build so comment-preview can name the artifact even
        # when a later step fails.
        id: names
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "artifact=docs-preview-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Generate API metadata
        # The metadata phase carries no genuine warnings as of #290, and every new one
        # must still fail the build: a new CS0108, a duplicate XML doc tag, or an
        # analyzer DocFX's Roslyn cannot load.
        #
        # `--warningsAsErrors` cannot be used to do that, because DocFX 2.78.5 emits
        # three unavoidable "Found project reference without a matching metadata
        # reference" warnings on the Linux runner. They come from Roslyn's
        # MSBuildWorkspace during project load -- minutes before the first "Processing"
        # line -- and are not caused by anything in this repository: the reference graph
        # is consistent, `ReferencePath` resolves to the correct project outputs, and the
        # same commit on the same SDK (10.0.400) produces zero warnings on Windows,
        # whether the tree is cold or warm, restored or built. 2.78.5 is the newest DocFX
        # released, so there is no version to move to. See #329.
        #
        # So the guard is applied here instead: any warning other than that one known
        # DocFX/Roslyn diagnostic fails the step, and the metadata that the warning claims
        # is missing is asserted to have been generated anyway.
        run: |
          set -o pipefail
          dotnet docfx metadata DocumentationSite/docfx.json 2>&1 | tee "$RUNNER_TEMP/docfx-metadata.log"

          unexpected="$(grep 'warning:' "$RUNNER_TEMP/docfx-metadata.log"             | grep -vF 'Found project reference without a matching metadata reference' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::DocFX metadata emitted warnings beyond the known workspace diagnostic (#329):"
            echo "$unexpected"
            exit 1
          fi

          # The warning is cosmetic only for as long as the metadata is still complete.
          for namespace in Ploch.Common Ploch.Common.Serialization Ploch.Common.DependencyInjection; do
            if [ ! -f "DocumentationSite/api/$namespace.yml" ]; then
              echo "::error::No metadata generated for $namespace - the #329 warning is no longer cosmetic."
              exit 1
            fi
          done

      - name: Build documentation site
        # The build phase is not guarded yet: two pre-existing InvalidFileLink warnings
        # (the ADR template's placeholder link, and a .json example that is outside the
        # site's content globs) remain. Tracked in #316.
        run: dotnet docfx build DocumentationSite/docfx.json

      - name: Upload artifact for the Pages deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: DocumentationSite/_site

      - name: Upload built site for the pull request preview
        # A plain artifact, not a Pages artifact: publish-preview downloads it, and
        # comment-preview links it as the fallback when no hosted lane is configured.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.names.outputs.artifact }}
          path: DocumentationSite/_site
          retention-days: 14
          if-no-files-found: error

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request'
    # The GITHUB_TOKEN write scopes for GitHub Pages are confined to the deploy job:
    # actions:read downloads the artifact, id-token:write mints the Pages OIDC token.
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-preview:
    name: Publish docs preview
    needs: build-docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the built site to the preview branch
    outputs:
      # true = the preview is live on the branch; abandoned = the pull request closed
      # mid-publish and nothing was pushed. Empty when this job never published.
      pushed: ${{ steps.publish.outputs.pushed }}
    # Publishes from different pull requests are deliberately NOT serialised against
    # each other. The workflow-level concurrency group is keyed per ref, so it only
    # supersedes an earlier run of the *same* pull request; a group shared across
    # pull requests would be worse than useless, because GitHub keeps at most one
    # pending run per group and cancels any earlier pending one, silently dropping a
    # preview rather than queueing it. Concurrent writers to the shared preview
    # branch are handled where the conflict actually happens instead: the push below
    # re-reads the branch and retries.
    steps:
      # Modelled on "Determine SonarCloud eligibility" in build-dotnet.yml: decide
      # once, in one place, whether this run can do privileged work, and skip with a
      # notice instead of failing when it cannot.
      - name: Determine preview publishing eligibility
        id: eligibility
        env:
          IS_UPSTREAM_REPO: ${{ github.repository == 'mrploch/ploch-common' }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
          PREVIEW_BASE_URL: ${{ vars.DOCS_PREVIEW_BASE_URL }}
        run: |
          set -euo pipefail
          # A fork of this repository has no business writing previews, and its PRs
          # would be judged against a preview branch nobody serves.
          if [ "$IS_UPSTREAM_REPO" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not running in mrploch/ploch-common; skipping docs preview publishing. The site was still built and uploaded as an artifact."
            exit 0
          fi
          # GITHUB_TOKEN is read-only for fork PRs and for Dependabot, so the branch
          # push cannot succeed. This is an expected condition, not a failure: the
          # build job above already gave the PR its docs signal.
          if [ "$IS_FORK_PR" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This pull request was raised from a fork or authored by Dependabot, so GITHUB_TOKEN is read-only. Skipping preview publishing; download the docs-preview artifact from this run to review the site locally."
            exit 0
          fi
          # Strip all whitespace so a variable set to only spaces counts as unset.
          if [ -n "$(printf '%s' "$PREVIEW_BASE_URL" | tr -d '[:space:]')" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Hosted preview lane enabled."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repository variable DOCS_PREVIEW_BASE_URL is not set, so there is no hosted preview target yet. Commenting with the downloadable site artifact instead. See docs/docs-preview.md to enable the hosted lane."
          fi

      # No source checkout: nothing in this job reads the repository working tree,
      # so omitting it removes any possibility of a preview step touching source.

      - name: Download built site
        if: steps.eligibility.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-docs.outputs.artifact-name }}
          path: preview-site

      - name: Publish preview to the preview branch
        id: publish
        if: steps.eligibility.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_BRANCH: ${{ vars.DOCS_PREVIEW_BRANCH || 'gh-pages-previews' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # SAFETY GATE. Everything below deletes a directory tree, stages the whole
          # worktree and force-writes $PREVIEW_BRANCH with a contents:write token, so
          # a repository variable pointing at a branch somebody else owns would have
          # this lane destroy it. `contents: write` does not distinguish branches, so
          # nothing but this check stands between a mis-set variable and the
          # production branch. Keep the list in step with docs-preview-cleanup.yml.
          case "$PREVIEW_BRANCH" in
            master|main|gh-pages)
              echo "::error::Refusing to publish previews to $PREVIEW_BRANCH"
              exit 1
              ;;
          esac

          # A throwaway clone keeps the preview branch's history entirely separate
          # from the source tree: this job never checks the repository out, so there
          # is no working copy for a preview step to disturb.
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          TARGET="pr-preview/pr-${PR_NUMBER}"
          # Written inside the subshell (which runs from another directory, hence the
          # absolute path) and read by the loop, so the outcome survives the attempt
          # boundary and reaches $GITHUB_OUTPUT exactly once.
          RESULT_FILE="${PWD}/publish-result.txt"
          rm -f "$RESULT_FILE"

          # Another pull request may push into the same branch between our fetch and
          # our push. Rather than queue behind a concurrency group - which GitHub
          # resolves by cancelling a pending run, losing that preview entirely -
          # re-read the branch and rebuild the commit on each attempt.
          #
          # The body is a subshell with its own `set -e`: a plain function called
          # under `set +e` (needed to capture the status) would inherit the disabled
          # errexit, letting a failed git command run on and a later successful push
          # report success over incomplete content.
          attempt_push() (
            set -euo pipefail
            rm -rf preview-branch
            mkdir preview-branch
            cd preview-branch
            git init -q
            git remote add origin "$REMOTE"
            # Distinguish "the branch does not exist yet" from "the fetch failed".
            # Treating a transient network error as an absent branch would rewrite
            # the branch from scratch and delete every other pull request's preview.
            set +e
            git ls-remote --exit-code --heads origin "$PREVIEW_BRANCH" >/dev/null
            ls_status=$?
            set -e
            if [ "$ls_status" -eq 0 ]; then
              git fetch -q --depth 1 origin "$PREVIEW_BRANCH"
              git checkout -q -B "$PREVIEW_BRANCH" FETCH_HEAD
            elif [ "$ls_status" -eq 2 ]; then
              # 2 is git ls-remote --exit-code's "no matching refs", i.e. the branch
              # genuinely does not exist yet. Any other status is a real failure.
              echo "Preview branch $PREVIEW_BRANCH does not exist yet; creating it as an orphan."
              git checkout -q --orphan "$PREVIEW_BRANCH"
            else
              echo "Could not reach the remote to list $PREVIEW_BRANCH (git ls-remote exited $ls_status)."
              exit 1
            fi
            rm -rf "$TARGET"
            mkdir -p "$TARGET"
            cp -R "../preview-site/." "$TARGET/"
            # GitHub Pages runs Jekyll over branch sources by default, which would
            # drop DocFX's underscore-prefixed asset folders.
            : > .nojekyll
            git add -A
            if git diff --cached --quiet; then
              # The branch already carries exactly this content, so the preview is
              # live and current - a published preview, not a no-op.
              echo "Preview content is unchanged; nothing to push."
              echo "true" > "$RESULT_FILE"
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "docs(preview): Publish preview for PR #${PR_NUMBER} (${HEAD_SHA})"
            # Last check before writing: if the pull request closed while this job was
            # building or retrying, the cleanup workflow has already run (or is about
            # to) and pushing now would resurrect a preview that nothing will ever
            # remove, because no second `closed` event follows.
            PR_STATE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)
            if [ "$PR_STATE" != "open" ]; then
              echo "::notice::Pull request #${PR_NUMBER} is no longer open; abandoning this preview publish so cleanup is not undone."
              echo "abandoned" > "$RESULT_FILE"
              exit 0
            fi
            git push -q origin "HEAD:${PREVIEW_BRANCH}"
            echo "true" > "$RESULT_FILE"
          )

          for attempt in 1 2 3 4 5; do
            # `attempt_push` must not be an `if` condition: that suppresses `set -e`
            # for the callee. Capture the status explicitly instead.
            set +e
            attempt_push
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Publish step completed on attempt $attempt."
              # Every zero-exit path above records its outcome. A missing file means
              # that contract was broken, so fail loudly rather than let the comment
              # step advertise a preview URL on a guess.
              if [ ! -f "$RESULT_FILE" ]; then
                echo "::error::The publish attempt reported success without recording an outcome."
                exit 1
              fi
              echo "pushed=$(cat "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt did not complete (the preview branch most likely moved); retrying."
            sleep $(( attempt * 5 ))
          done
          echo "::error::Could not publish the documentation preview to $PREVIEW_BRANCH after 5 attempts."
          exit 1

  # A separate job with `if: always()` so the pull request always gets a comment -
  # including when the docs build itself failed, which is exactly the case a reviewer
  # most needs to be told about. While the comment lived in `publish-preview` it was
  # skipped along with that job whenever `needs: build-docs` failed, leaving a broken
  # docs build with no comment at all.
  comment-preview:
    name: Comment with the docs preview
    needs: [build-docs, publish-preview]
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.build-docs.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write   # post/update the sticky preview comment
    steps:
      - name: Determine commenting eligibility
        id: eligibility
        env:
          IS_UPSTREAM_REPO: ${{ github.repository == 'mrploch/ploch-common' }}
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -euo pipefail
          # Same gate as the publishing job: a read-only GITHUB_TOKEN cannot post a
          # comment either, so skip with a notice rather than fail the run.
          if [ "$IS_UPSTREAM_REPO" != "true" ] || [ "$IS_FORK_PR" = "true" ] || [ "$IS_DEPENDABOT" = "true" ]; then
            echo "comment=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GITHUB_TOKEN is read-only for this pull request (a fork, a fork of this repository, or Dependabot), so no preview comment can be posted. The built site is attached to the Docs Preview run as an artifact."
          else
            echo "comment=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update the preview comment
        if: steps.eligibility.outputs.comment == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RESULT: ${{ needs.build-docs.result }}
          PUBLISH_RESULT: ${{ needs.publish-preview.result }}
          PUSHED: ${{ needs.publish-preview.outputs.pushed }}
          PREVIEW_BASE_URL: ${{ vars.DOCS_PREVIEW_BASE_URL }}
          ARTIFACT_NAME: ${{ needs.build-docs.outputs.artifact-name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The marker makes the comment sticky: subsequent pushes edit it in place
          # rather than burying the PR conversation under one comment per commit.
          MARKER="<!-- docs-preview:pr-${PR_NUMBER} -->"
          export MARKER
          # The body is selected from the *observed* outcome of both jobs, never from
          # eligibility alone: a run that abandoned its push, or failed to push, must
          # not advertise a preview URL that was never written.
          {
            printf '%s\n' "$MARKER"
            printf '### 📖 Documentation preview\n\n'
            if [ "$BUILD_RESULT" != "success" ]; then
              printf '⚠️ **The documentation build failed for this pull request, so there is no preview.**\n\n'
              printf '**[Open the workflow run](%s)** to see which DocFX step failed.\n\n' "$RUN_URL"
              printf 'Attempted on `%s`. This comment is rewritten on the next push.\n' "$HEAD_SHA"
            elif [ "$PUSHED" = "true" ]; then
              BASE="${PREVIEW_BASE_URL%/}"
              printf '**[Open the preview for this pull request](%s/pr-preview/pr-%s/)**\n\n' "$BASE" "$PR_NUMBER"
              printf 'Built from `%s`. The preview is served from a branch that is separate from the production site, and it is deleted when this pull request is closed or merged.\n' "$HEAD_SHA"
            elif [ "$PUSHED" = "abandoned" ]; then
              printf 'This pull request closed while its preview was being published, so nothing was published.\n\n'
              printf '**[Download the built site from the workflow run](%s)** if you still need it.\n' "$RUN_URL"
            elif [ "$PUBLISH_RESULT" = "failure" ]; then
              printf '⚠️ **The site built, but publishing the preview failed.**\n\n'
              printf '**[Open the workflow run](%s)** for the publishing log; the built site is attached to it as `%s`.\n\n' "$RUN_URL" "$ARTIFACT_NAME"
              printf 'Built from `%s`.\n' "$HEAD_SHA"
            else
              printf 'No hosted preview target is configured, so the built site is attached to this run instead.\n\n'
              printf '**[Download `%s` from the workflow run](%s)**, unzip it, and open `index.html`.\n\n' "$ARTIFACT_NAME" "$RUN_URL"
              printf 'Built from `%s`. See `docs/docs-preview.md` for how to enable hosted previews.\n' "$HEAD_SHA"
            fi
          } > preview-comment.md
          # `gh api --slurp` is rejected outright when combined with --jq ("the
          # --slurp option is not supported with --jq or --template"), so the page
          # boundary has to be handled on this side instead. With --paginate alone gh
          # runs --jq per page and concatenates the outputs, so a filter that emits
          # zero-or-one id per page yields one id per line overall; `sed -n 1p` takes
          # the first. It reads the whole stream, so it cannot SIGPIPE gh under
          # `set -o pipefail` the way `head -n 1` could.
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | contains($ENV.MARKER)) | .id' | sed -n 1p)
          if [ -z "$COMMENT_ID" ] || [ "$COMMENT_ID" = "null" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -F body=@preview-comment.md --silent
            echo "Posted a new preview comment."
          else
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -F body=@preview-comment.md --silent
            echo "Updated preview comment ${COMMENT_ID}."
          fi
