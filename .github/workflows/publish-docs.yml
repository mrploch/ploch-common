name: Publish Docs

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull request validation runs are keyed per-ref so they neither queue behind nor block a Pages deployment.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # NBGV needs full history

      - name: Clone mrploch-development (shared build config)
        run: git clone --depth 1 https://github.com/mrploch/mrploch-development.git ../mrploch-development

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore .NET tools (docfx is pinned in .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Restore all projects DocFX will load
        # DocFX 2.78.5 has no restore step of its own: its Roslyn MSBuildWorkspace
        # shells out to `dotnet restore` lazily, from inside the project-load loop, the
        # first time it meets a project. A ProjectReference whose target is restored
        # during that same pass has no resolved TargetPath yet when the referencing
        # project's design-time build runs, so Roslyn cannot match the reference to a
        # metadata reference and logs a load-phase warning. Restoring everything up
        # front removes the lazy restore, and with it the warning. See #329.
        run: find src -name '*.csproj' -print0 | xargs -0 -P 4 -n 1 dotnet restore

      - name: Generate API metadata
        # The metadata phase is warning-free as of #290, so it is guarded with
        # --warningsAsErrors: a new CS0108, a duplicate XML doc tag, or an analyzer that
        # DocFX's Roslyn cannot load now fails the build instead of accumulating silently.
        run: dotnet docfx metadata DocumentationSite/docfx.json --warningsAsErrors

      - name: Build documentation site
        # The build phase is not guarded yet: two pre-existing InvalidFileLink warnings
        # (the ADR template's placeholder link, and a .json example that is outside the
        # site's content globs) remain. Tracked in #316.
        run: dotnet docfx build DocumentationSite/docfx.json

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: DocumentationSite/_site

  deploy-docs:
    needs: build-docs
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
