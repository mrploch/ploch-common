  namespace: Ploch.Common.Apps.Model
  summary: Gets the additional metadata associated with the execution of an action.
  remarks: >-
    The <code>Metadata</code> property is a dictionary that allows associating arbitrary

    key-value pairs with the execution of an action. This can be used to store

    additional contextual information relevant to the action's execution, such as

    execution time, custom tags, or processing details.

    Keys are case-sensitive strings, while values can be any object, including null.
  example: []
  syntax:
    content: public IDictionary<string, object?> Metadata { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: >-
        A dictionary where the keys are <xref href="System.String" data-throw-if-not-resolved="false"></xref> and the values are <xref href="System.Object" data-throw-if-not-resolved="false"></xref>.

        By default, an empty dictionary is initialized when the object is created.
    content.vb: Public ReadOnly Property Metadata As IDictionary(Of String, Object)
