  assemblies:
  - Ploch.Common.Apps.Actions.Model
  namespace: Ploch.Common.Apps.Model
  summary: >-
    Manages the execution of multiple action handlers to process a given action

    and ensures the coordination of their results.
  remarks: >-
    This class is responsible for iterating over a collection of action handlers and invoking their

    <xref href="Ploch.Common.Apps.Model.IActionHandler%603.ExecuteAsync(%601%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method. If a handler

    succeeds in processing the action, it will immediately return the result.

    If all handlers fail to process the action, a failure result is returned, consolidating all individual handler results.
  example: []
  syntax:
    content: 'public class ActionHandlerManager<TSystemApplication, TActionInfo, TSystemActionHandler> : ActionHandler<TSystemApplication, TActionInfo, ActionHandlerManagerResult<TSystemApplication>>, IActionHandlerManager<TSystemApplication, TActionInfo>, IActionHandler<TSystemApplication, TActionInfo, ActionHandlerManagerResult<TSystemApplication>> where TSystemApplication : IActionTargetDescriptor where TActionInfo : IActionInfo<TSystemApplication>, IActionInfo<IActionTargetDescriptor> where TSystemActionHandler : IActionHandler<TSystemApplication, TActionInfo>'
    typeParameters:
    - id: TSystemApplication
      description: >-
        The type that represents the application or system on which the actions are executed.

        Must implement <xref href="Ploch.Common.Apps.Model.IActionTargetDescriptor" data-throw-if-not-resolved="false"></xref>.
    - id: TActionInfo
      description: >-
        Information about the action being executed, which includes details about the application target.

        Must implement <xref href="Ploch.Common.Apps.Model.IActionInfo%601" data-throw-if-not-resolved="false"></xref>.
    - id: TSystemActionHandler
      description: >-
        The type of the individual action handlers that will be invoked.

        Must implement <xref href="Ploch.Common.Apps.Model.IActionHandler%602" data-throw-if-not-resolved="false"></xref>.
