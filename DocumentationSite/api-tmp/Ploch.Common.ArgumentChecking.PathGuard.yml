  namespace: Ploch.Common.ArgumentChecking
  summary: Provides methods for validating and ensuring the validity of file system paths.
  remarks: >-
    This class contains utility methods to validate paths, ensuring they are not null, empty,

    contain invalid characters, or are not rooted. It is designed to simplify and standardize

    path validation logic across the application.
  example: []
  syntax:
    content: >-
      [SuppressMessage("Performance", "CA1863:Use 'CompositeFormat'", Justification = "CompositeFormat is unavailable on netstandard2.0; caching it for these call sites is not worth the multi-target complexity.")]

      public static class PathGuard
    content.vb: >-
