    startLine: 116
  assemblies:
  - Ploch.Common.Net9
  namespace: Ploch.Common.AssemblyLoading
  summary: >-
    Scans all assemblies available in the current application domain,

    processes them based on the specified configuration, and loads qualified types.
  remarks: >-
    The <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.ProcessAllAssemblies" data-throw-if-not-resolved="false"></xref> method triggers the loading process by scanning all assemblies

    that are currently loaded into the AppDomain's <xref href="System.Runtime.Loader.AssemblyLoadContext" data-throw-if-not-resolved="false"></xref> instances. This includes

    any assemblies already loaded and any subsequently loaded assemblies via subscription to the

    <xref href="System.AppDomain.AssemblyLoad" data-throw-if-not-resolved="false"></xref> event.

    This method determines which types to load based on the filtering rules defined in the

    <xref href="Ploch.Common.AssemblyLoading.TypeLoadingConfiguration" data-throw-if-not-resolved="false"></xref> provided during the initialization of the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader" data-throw-if-not-resolved="false"></xref> instance.

    This method populates the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.LoadedTypes" data-throw-if-not-resolved="false"></xref> collection with the identified and loaded types.
  example:
  - >-
    Here's how you can invoke <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.ProcessAllAssemblies" data-throw-if-not-resolved="false"></xref> to load types based on specific criteria:


    <pre><code class="lang-csharp">var configuration = new TypeLoadingConfiguration(

    baseTypes: new[] { typeof(MyBaseClass) },

    includeAssemblies: new[] { "MyAssemblyName" });

    var typeLoader = new AppDomainTypesLoader(configuration);

    // Process and load matching types from all assemblies in the current AppDomain.

    typeLoader.ProcessAllAssemblies();

    // Access the results: types loaded and filtered by the configuration.

    foreach (var type in typeLoader.LoadedTypes)

    {

    Console.WriteLine(type.FullName);

    }</code></pre>
  syntax:
    content: public void ProcessAllAssemblies()
    content.vb: Public Sub ProcessAllAssemblies()
  overload: Ploch.Common.AssemblyLoading.AppDomainTypesLoader.ProcessAllAssemblies*
