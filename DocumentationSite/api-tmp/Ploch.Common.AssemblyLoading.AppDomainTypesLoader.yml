  assemblies:
  - Ploch.Common.Net9
  namespace: Ploch.Common.AssemblyLoading
  summary: >-
    Gets the collection of loaded <xref href="System.Type" data-throw-if-not-resolved="false"></xref> objects identified

    and processed by the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader" data-throw-if-not-resolved="false"></xref> instance.
  remarks: >-
    The <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.LoadedTypes" data-throw-if-not-resolved="false"></xref> property contains the set of types loaded from the assemblies

    available in the current application domain and filtered based on the criteria specified

    in the <xref href="Ploch.Common.AssemblyLoading.TypeLoadingConfiguration" data-throw-if-not-resolved="false"></xref> during the initialization of the loader.

    These types are determined after invoking the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.ProcessAllAssemblies" data-throw-if-not-resolved="false"></xref> method.

    If no assemblies or types meet the criteria specified in the configuration,

    the collection will remain empty.
  example:
  - >-
    To use the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.LoadedTypes" data-throw-if-not-resolved="false"></xref> property, you should first create an instance

    of <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader" data-throw-if-not-resolved="false"></xref> with a configuration indicating your filtering

    preferences. After that, invoke <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.ProcessAllAssemblies" data-throw-if-not-resolved="false"></xref> to populate the

    <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader.LoadedTypes" data-throw-if-not-resolved="false"></xref> property:


    <pre><code class="lang-csharp">var config = new TypeLoadingConfiguration(baseTypes: new[] { typeof(MyBaseClass) });

    var loader = new AppDomainTypesLoader(config);

    loader.ProcessAllAssemblies();

    var loadedTypes = loader.LoadedTypes; // Enumerates all types derived from MyBaseClass.</code></pre>
  syntax:
    content: public IEnumerable<Type> LoadedTypes { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IEnumerable{System.Type}
      description: >-
        An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> of <xref href="System.Type" data-throw-if-not-resolved="false"></xref> objects representing the

        types loaded from assemblies.
