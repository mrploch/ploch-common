  namespace: Ploch.Common.AssemblyLoading
  summary: Retrieves types from the loaded assemblies that implement or derive from the specified base type.
  remarks: >-
    This method examines all types loaded into the current application domain by the <xref href="Ploch.Common.AssemblyLoading.AppDomainTypesLoader" data-throw-if-not-resolved="false"></xref>.

    It filters the types based on their assignability to the provided base type and optionally their abstract status.
  example: []
  syntax:
    content: public IEnumerable<Type> GetTypesImplementing<TBaseType>(bool includeAbstract = false)
    parameters:
    - id: includeAbstract
      type: System.Boolean
      description: >-
        A boolean value indicating whether abstract types should be included in the result.

        If <code>true</code>, abstract types are included; otherwise, they are excluded.
    typeParameters:
    - id: TBaseType
      description: The base type or interface that the returned types should implement or inherit from.
    return:
      type: System.Collections.Generic.IEnumerable{System.Type}
      description: >-
        An enumerable of <xref href="System.Type" data-throw-if-not-resolved="false"></xref> objects representing types that are assignable to <code class="typeparamref">TBaseType</code>

        and meet the specified filtering criteria.
