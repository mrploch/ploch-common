  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Collections
  summary: Adds multiple items to a collection. Provides control over handling duplicates using the <code class="paramref">duplicateHandling</code> parameter.
  example: []
  syntax:
    content: 'public static ICollection<TItem> AddMany<TCollection, TItem>(this TCollection collection, DuplicateHandling duplicateHandling = DuplicateHandling.Throw, params TItem[] items) where TCollection : ICollection<TItem>'
    parameters:
    - id: collection
      type: '{TCollection}'
      description: The target collection to which items are added.
    - id: duplicateHandling
      type: Ploch.Common.Collections.DuplicateHandling
      description: >-
        Specifies how duplicate items should be handled:

        <xref href="Ploch.Common.Collections.DuplicateHandling.Ignore" data-throw-if-not-resolved="false"></xref>, <xref href="Ploch.Common.Collections.DuplicateHandling.Overwrite" data-throw-if-not-resolved="false"></xref>, or <xref href="Ploch.Common.Collections.DuplicateHandling.Throw" data-throw-if-not-resolved="false"></xref>.
    - id: items
      type: '{TItem}[]'
      description: The items to add to the collection.
    typeParameters:
    - id: TCollection
      description: The type of the collection being extended, which implements <xref href="System.Collections.Generic.ICollection%601" data-throw-if-not-resolved="false"></xref>.
    - id: TItem
      description: The type of items in the collection.
    return:
      type: System.Collections.Generic.ICollection{{TItem}}
      description: The same instance of <code class="paramref">collection</code> after items have been added.
    content.vb: Public Shared Function AddMany(Of TCollection As ICollection(Of TItem), TItem)(collection As TCollection, duplicateHandling As DuplicateHandling = DuplicateHandling.Throw, ParamArray items As TItem()) As ICollection(Of TItem)
