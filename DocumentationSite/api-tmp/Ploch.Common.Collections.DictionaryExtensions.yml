  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Collections
  summary: Adds multiple key-value pairs to a dictionary with options for handling duplicate keys.
  example: []
  syntax:
    content: 'public static IDictionary<TKey, TValue> AddMany<TDictionary, TKey, TValue>(this TDictionary dictionary, IEnumerable<KeyValuePair<TKey, TValue>> items, DuplicateHandling duplicateHandling = DuplicateHandling.Throw) where TDictionary : class, IDictionary<TKey, TValue>'
    parameters:
    - id: dictionary
      type: '{TDictionary}'
      description: The dictionary to add items to.
    - id: items
      type: System.Collections.Generic.IEnumerable{System.Collections.Generic.KeyValuePair{{TKey},{TValue}}}
      description: The collection of key-value pairs to add to the dictionary.
    - id: duplicateHandling
      type: Ploch.Common.Collections.DuplicateHandling
      description: 'Specifies how to handle duplicate keys: throw an exception, overwrite existing values, or ignore duplicates.'
    typeParameters:
    - id: TDictionary
      description: The dictionary type.
    - id: TKey
      description: The type of keys in the dictionary.
    - id: TValue
      description: The type of the value in the dictionary.
    return:
      type: System.Collections.Generic.IDictionary{{TKey},{TValue}}
      description: The dictionary with added items.
    content.vb: Public Shared Function AddMany(Of TDictionary As {Class, IDictionary(Of TKey, TValue)}, TKey, TValue)(dictionary As TDictionary, items As IEnumerable(Of KeyValuePair(Of TKey, TValue)), duplicateHandling As DuplicateHandling = DuplicateHandling.Throw) As IDictionary(Of TKey, TValue)
  overload: Ploch.Common.Collections.DictionaryExtensions.AddMany*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code class="paramref">dictionary</code> or <code class="paramref">items</code> is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      Thrown when a duplicate key is encountered and <code class="paramref">duplicateHandling</code> is set to

      <xref href="Ploch.Common.Collections.DuplicateHandling.Throw" data-throw-if-not-resolved="false"></xref>.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: Thrown when <code class="paramref">duplicateHandling</code> has an invalid value.
  nameWithType.vb: DictionaryExtensions.AddMany(Of TDictionary, TKey, TValue)(TDictionary, IEnumerable(Of KeyValuePair(Of TKey, TValue)), DuplicateHandling)
