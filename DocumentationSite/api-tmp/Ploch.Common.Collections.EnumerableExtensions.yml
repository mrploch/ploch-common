  summary: Takes random <code class="paramref">count</code> amount of items from the <code class="paramref">source</code> enumerable.
  remarks: >-
    Selection is performed with a partial Fisher-Yates shuffle over a copy of the source, giving O(n) setup and

    O(<code class="paramref">count</code>) selection with uniform selection probability and no duplicate picks. A

    non-positive <code class="paramref">count</code> returns without enumerating <code class="paramref">source</code>.
