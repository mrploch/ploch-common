      type: System.Collections.Generic.IEnumerable{{TValue}}
      description: The source enumerable.
    - id: count
      type: System.Int32
      description: >-
        The number of values to take. When greater than the source size, all items are returned; when zero or

        negative, an empty sequence is returned (matching <xref href="System.Linq.Enumerable.Take%60%601(System.Collections.Generic.IEnumerable%7b%60%600%7d%2cSystem.Int32)" data-throw-if-not-resolved="false"></xref> semantics).
