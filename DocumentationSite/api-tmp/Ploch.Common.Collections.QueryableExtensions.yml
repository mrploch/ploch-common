  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Collections
  summary: Creates an enumerable query if the condition is true.
  remarks: This method is useful when you want to conditionally add a where clause to a query.
  example:
  - >-
    Method below returns a list of cars ordered by creation date.

    If the <code>createdAfter</code> is not null, the query will be filtered by the creation date.

    If the <code>createdBefore</code> is not null, the query will be further filtered by the creation date.


    <pre><code class="lang-csharp">var carsList = GetCars();

    carsList.OrderBy(x =&gt; x.Created)

    .If(createdAfter.HasValue, x =&gt; x.Where(y =&gt; y.Created &gt; createdAfter!.Value))

    .If(createdBefore.HasValue, x =&gt; x.Where(y =&gt; y.Created &lt; createdBefore!.Value))

    .If(first.HasValue, x =&gt; x.Take(first!.Value))</code></pre>
  syntax:
    content: public static IQueryable<T> If<T>(this IQueryable<T> queryable, bool condition, Func<IQueryable<T>, IQueryable<T>> action)
