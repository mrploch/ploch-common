    - id: queryable
      type: System.Linq.IQueryable{{T}}
      description: The source enumerable.
    - id: condition
      type: System.Boolean
      description: The condition.
    - id: action
      type: System.Func{System.Linq.IQueryable{{T}},System.Linq.IQueryable{{T}}}
      description: The query action to perform on <code class="paramref">queryable</code>.
    typeParameters:
    - id: T
      description: The enumerable value type.
    return:
      type: System.Linq.IQueryable{{T}}
      description: The resulting enumerable.
