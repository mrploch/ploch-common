    id: ToEpochSeconds
    path: ../src/Common/DateTimeExtensions.cs
    startLine: 28
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: >-
    Converts a <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> to Epoch Seconds (Unix Timestamp - seconds since 00:00:00 UTC on 1 January

    1970).
  remarks: >-
    <p>
        Helper method which simply casts <code>DateTime</code> to <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> and calls
        <xref href="System.DateTimeOffset.ToUnixTimeSeconds" data-throw-if-not-resolved="false"></xref>.
    </p>

    <p>
        This class doesn't do any manipulations of time-zones, so the time zone of the provided instance of
        <code>DateTime</code> will be used.
    </p>
  example: []
  syntax:
    content: public static long ToEpochSeconds(this DateTime dateTime)
    parameters:
    - id: dateTime
      type: System.DateTime
      description: The date time.
    return:
      type: System.Int64
      description: Epoch seconds value.
    content.vb: Public Shared Function ToEpochSeconds(dateTime As Date) As Long
