  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: A constant string representing the date format "yyyyMMdd".
  remarks: >-
    This format is used to represent a date as a continuous sequence of numeric characters

    without any separators. The components are in the following order:

    Year (4 digits), Month (2 digits), and Day (2 digits).
  example:
  - >-
    For example, a date value of <code>2023-10-15</code> will be represented as <code>20231015</code>

    when formatted using this string.
  syntax:
    content: public const string YearMonthDayNumbersOnly = "yyyyMMdd"
    return:
      type: System.String
    content.vb: Public Const YearMonthDayNumbersOnly As String = "yyyyMMdd"
