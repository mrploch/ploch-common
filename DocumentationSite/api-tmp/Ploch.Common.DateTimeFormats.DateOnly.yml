  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: A constant string representing the date format "yyyy-MM-dd".
  remarks: >-
    This format is used to represent a date in a human-readable form with dashes as separators.

    The components are in the following order: Year (4 digits), Month (2 digits), and Day (2 digits),

    separated by dashes (<code>-</code>).
  example:
  - >-
    For example, a date value of <code>2023-10-15</code> will be represented as <code>"2023-10-15"</code>

    when formatted using this string.
  syntax:
    content: public const string YearMonthDayNumbersWithDashes = "yyyy-MM-dd"
    return:
      type: System.String
    content.vb: Public Const YearMonthDayNumbersWithDashes As String = "yyyy-MM-dd"
