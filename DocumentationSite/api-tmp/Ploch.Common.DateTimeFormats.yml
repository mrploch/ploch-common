  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: A constant string representing the date-time format "yyyy-MM-dd HH:mm:ss".
  remarks: >-
    This format is used to represent a full date and time with dashed separators between the

    year, month, and day, and colons separating the hour, minute, and second components.

    The components are in the following order:

    Year (4 digits), Month (2 digits), Day (2 digits), Hour (2 digits - 24-hour format),

    Minute (2 digits), and Second (2 digits).
  example:
  - >-
    For example, a date-time value of <code>2023-10-15 14:30:45</code> will be represented as <code>"2023-10-15 14:30:45"</code>

    when formatted using this string.
  syntax:
    content: public const string YearMonthDayHourMinuteSecondNumbersWithDashesAndColons = "yyyy-MM-dd HH:mm:ss"
    return:
      type: System.String
    content.vb: Public Const YearMonthDayHourMinuteSecondNumbersWithDashesAndColons As String = "yyyy-MM-dd HH:mm:ss"
