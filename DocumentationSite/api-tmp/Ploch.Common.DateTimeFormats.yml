  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: A constant string representing the date-time format "yyyyMMddHHmmss".
  remarks: >-
    This format is used to represent a full date and time as a continuous sequence

    of numeric characters without any separators. The components are in the following order:

    Year (4 digits), Month (2 digits), Day (2 digits), Hour (2 digits - 24-hour format),

    Minute (2 digits), and Second (2 digits).
  example:
  - >-
    For example, a date-time value of <code>2023-10-15 14:30:45</code> will be represented as <code>20231015143045</code>

    when formatted using this string.
  syntax:
    content: public const string YearMonthDayHourMinuteSecondNumbersOnly = "yyyyMMddHHmmss"
    return:
      type: System.String
    content.vb: Public Const YearMonthDayHourMinuteSecondNumbersOnly As String = "yyyyMMddHHmmss"
