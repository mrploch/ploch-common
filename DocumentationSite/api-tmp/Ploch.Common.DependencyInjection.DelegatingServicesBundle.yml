  assemblies:
  - Ploch.Common.DependencyInjection
  namespace: Ploch.Common.DependencyInjection
  summary: Executes all registered service configuration actions to configure the service collection.
  remarks: >-
    This method iterates through all previously registered configuration actions (added via

    <xref href="Ploch.Common.DependencyInjection.DelegatingServicesBundle.Configure(System.Action%7bSystem.ValueTuple%7bMicrosoft.Extensions.DependencyInjection.IServiceCollection%2cMicrosoft.Extensions.Configuration.IConfiguration%7d%7d)" data-throw-if-not-resolved="false"></xref>) and executes

    them in the order they were added. Each action receives both the service collection and

    the provided configuration instance.


    <p>
        If any configuration action throws an exception, the configuration process will be
        interrupted and the exception will propagate to the caller.
    </p>
  example: []
  syntax:
    content: protected override void Configure(IConfiguration configuration)
    parameters:
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: The configuration instance to pass to each configuration action. May be <code>null</code>.
    content.vb: Protected Overrides Sub Configure(configuration As IConfiguration)
  overridden: Ploch.Common.DependencyInjection.ConfigurableServicesBundle.Configure(Microsoft.Extensions.Configuration.IConfiguration)
  overload: Ploch.Common.DependencyInjection.DelegatingServicesBundle.Configure*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when the <xref href="Ploch.Common.DependencyInjection.ServicesBundle.Services" data-throw-if-not-resolved="false"></xref> property is <code>null</code>.
  - type: System.Exception
    commentId: T:System.Exception
    description: Thrown when any of the registered configuration action delegates throws an exception.
