  assemblies:
  - Ploch.Common.DependencyInjection
  namespace: Ploch.Common.DependencyInjection
  summary: Gets the current configuration instance accessible within the implementation of the interface.
  remarks: >-
    This property provides access to an <xref href="Microsoft.Extensions.Configuration.IConfiguration" data-throw-if-not-resolved="false"></xref> instance that contains the application's

    configured settings. Typically, the configuration data is sourced from a combination of providers like JSON files,

    environment variables, command-line arguments, or user secrets.

    In implementations of interfaces such as <code>IServicesBundle</code>, it can be used to supply necessary configuration

    data to registered service dependencies. This property enables flexibility and centralized management of

    configuration for applications.
  example: []
  syntax:
    content: IConfiguration? Configuration { get; }
    parameters: []
    return:
      type: Microsoft.Extensions.Configuration.IConfiguration
    content.vb: ReadOnly Property Configuration As IConfiguration
