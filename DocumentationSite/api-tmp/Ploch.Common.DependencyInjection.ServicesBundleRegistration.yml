  assemblies:
  - Ploch.Common.DependencyInjection
  namespace: Ploch.Common.DependencyInjection
  summary: Registers a services bundle instance with the service collection.
  remarks: >-
    This method automatically detects if the provided bundle is a <xref href="Ploch.Common.DependencyInjection.ConfigurableServicesBundle" data-throw-if-not-resolved="false"></xref>

    and assigns the configuration before calling the bundle's configuration method. This ensures that

    configuration-dependent services have access to the configuration during registration.
  example:
  - >-
    <pre><code class="lang-csharp">var bundle = new MyCustomServicesBundle();

    services.AddServicesBundle(bundle, configuration);


    // For configurable bundles

    var configurableBundle = new DatabaseServicesBundle();

    services.AddServicesBundle(configurableBundle, configuration);</code></pre>
  syntax:
    content: public static IServiceCollection AddServicesBundle(this IServiceCollection services, IServicesBundle servicesBundle, IConfiguration? configuration = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to register the bundle with.
    - id: servicesBundle
      type: Ploch.Common.DependencyInjection.IServicesBundle
      description: >-
        The services bundle instance to register. This bundle will have its

        <xref href="Ploch.Common.DependencyInjection.IServicesBundle.Configure(Microsoft.Extensions.DependencyInjection.IServiceCollection)" data-throw-if-not-resolved="false"></xref> method called to register services.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: >-
        Optional configuration instance to provide to configurable bundles. If the bundle implements

        <xref href="Ploch.Common.DependencyInjection.ConfigurableServicesBundle" data-throw-if-not-resolved="false"></xref>, this configuration will be assigned to its

        <xref href="Ploch.Common.DependencyInjection.ServicesBundle.Configuration" data-throw-if-not-resolved="false"></xref> property before configuration.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The same <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> instance to enable method chaining.
    content.vb: Public Shared Function AddServicesBundle(services As IServiceCollection, servicesBundle As IServicesBundle, configuration As IConfiguration = Nothing) As IServiceCollection
  overload: Ploch.Common.DependencyInjection.ServicesBundleRegistration.AddServicesBundle*
  exceptions:
