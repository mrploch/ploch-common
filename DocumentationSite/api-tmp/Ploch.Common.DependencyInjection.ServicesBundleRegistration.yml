    startLine: 118
  assemblies:
  - Ploch.Common.DependencyInjection
  namespace: Ploch.Common.DependencyInjection
  summary: Registers a services bundle by type with the service collection.
  remarks: >-
    This method creates a new instance of the specified bundle type using its parameterless constructor,

    then delegates to <xref href="Ploch.Common.DependencyInjection.ServicesBundleRegistration.AddServicesBundle(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cPloch.Common.DependencyInjection.IServicesBundle%2cMicrosoft.Extensions.Configuration.IConfiguration)" data-throw-if-not-resolved="false"></xref>

    to perform the actual registration. This provides a convenient way to register bundles without

    manually instantiating them.


    <p>
        The bundle type must have a public parameterless constructor. If the bundle implements
        <xref href="Ploch.Common.DependencyInjection.ConfigurableServicesBundle" data-throw-if-not-resolved="false"></xref>, the provided configuration will be automatically
        assigned before the bundle's configuration method is called.
    </p>
  example:
  - >-
    <pre><code class="lang-csharp">// Register a simple bundle

    services.AddServicesBundle&lt;LoggingServicesBundle&gt;();


    // Register a configurable bundle with configuration

    services.AddServicesBundle&lt;DatabaseServicesBundle&gt;(configuration);


    // Method chaining

    services.AddServicesBundle&lt;CacheServicesBundle&gt;(configuration)
            .AddServicesBundle&lt;SecurityServicesBundle&gt;(configuration);</code></pre>
  syntax:
    content: 'public static IServiceCollection AddServicesBundle<TServicesBundle>(this IServiceCollection services, IConfiguration? configuration = null) where TServicesBundle : IServicesBundle, new()'
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to register the bundle with.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: >-
        Optional configuration instance to provide to configurable bundles. If the bundle type implements

        <xref href="Ploch.Common.DependencyInjection.ConfigurableServicesBundle" data-throw-if-not-resolved="false"></xref>, this configuration will be assigned to its

        <xref href="Ploch.Common.DependencyInjection.ServicesBundle.Configuration" data-throw-if-not-resolved="false"></xref> property before configuration.
    typeParameters:
    - id: TServicesBundle
      description: >-
        The type of services bundle to create and register. Must implement <xref href="Ploch.Common.DependencyInjection.IServicesBundle" data-throw-if-not-resolved="false"></xref>

        and have a parameterless constructor.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The same <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> instance to enable method chaining.
    content.vb: Public Shared Function AddServicesBundle(Of TServicesBundle As {IServicesBundle, New})(services As IServiceCollection, configuration As IConfiguration = Nothing) As IServiceCollection
  overload: Ploch.Common.DependencyInjection.ServicesBundleRegistration.AddServicesBundle*
  exceptions:
  - type: System.MissingMethodException
    commentId: T:System.MissingMethodException
    description: Thrown when <code class="typeparamref">TServicesBundle</code> does not have a public parameterless constructor.
  nameWithType.vb: ServicesBundleRegistration.AddServicesBundle(Of TServicesBundle)(IServiceCollection, IConfiguration)
  fullName.vb: Ploch.Common.DependencyInjection.ServicesBundleRegistration.AddServicesBundle(Of TServicesBundle)(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration)
  name.vb: AddServicesBundle(Of TServicesBundle)(IServiceCollection, IConfiguration)
