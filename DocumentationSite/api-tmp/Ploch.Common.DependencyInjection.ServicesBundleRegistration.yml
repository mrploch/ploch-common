  assemblies:
  - Ploch.Common.DependencyInjection
  namespace: Ploch.Common.DependencyInjection
  summary: Provides extension methods for registering services bundles with the dependency injection container.
  remarks: >-
    This static class contains extension methods that simplify the registration of <xref href="Ploch.Common.DependencyInjection.IServicesBundle" data-throw-if-not-resolved="false"></xref>

    implementations with an <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref>. It supports both instance-based and type-based

    registration patterns, with optional configuration support for configurable bundles.


    <p>
        The methods automatically handle the configuration assignment for bundles that implement
        <xref href="Ploch.Common.DependencyInjection.ConfigurableServicesBundle" data-throw-if-not-resolved="false"></xref>, ensuring that configuration-dependent services
        can access the provided configuration during registration.
    </p>
  example: []
  syntax:
