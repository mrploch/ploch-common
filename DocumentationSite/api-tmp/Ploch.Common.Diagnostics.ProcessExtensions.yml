  nameWithType: ProcessExtensions.SetSingleProcessorAffinity(Process, int)
  fullName: Ploch.Common.Diagnostics.ProcessExtensions.SetSingleProcessorAffinity(System.Diagnostics.Process, int)
  type: Method
  source:
    remote:
      path: src/Common/Diagnostics/ProcessExtensions.cs
