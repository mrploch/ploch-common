  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Diagnostics
  summary: Sets the processor affinity of the process to the specified set of processors.
  remarks: >-
    Processor affinity is only supported on Windows and Linux; calling this on other platforms throws <xref href="System.PlatformNotSupportedException" data-throw-if-not-resolved="false"></xref>.


    <p>

    <xref href="System.Diagnostics.Process.ProcessorAffinity" data-throw-if-not-resolved="false"></xref> is a pointer-sized bitmask, so processors beyond the native pointer width cannot be

    addressed — for example processors 32 and above in a 32-bit process, or 64 and above on machines with more than

    64 logical processors. Such processor numbers are rejected with <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    Processor numbers within the mask width are <b>not</b> validated against the number of processors available to the

    current process: <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref> is a processor <i>count</i> (which, since .NET 6, already

    reflects the process's own affinity and CPU limits), not an upper bound on valid processor indices — a process

    constrained to processors 8–15 may legitimately target processor 12. Requesting a processor that does not exist on

    the machine is rejected by the operating system when the affinity is applied (typically as a

    <xref href="System.ComponentModel.Win32Exception" data-throw-if-not-resolved="false"></xref>).

    </p>
  example: []
  syntax:
    content: public static void SetEnabledProcessors(this Process process, params int[] enabledProcessorsNumbers)
    parameters:
    - id: process
      type: System.Diagnostics.Process
      description: The process whose affinity will be set.
    - id: enabledProcessorsNumbers
      type: System.Int32[]
      description: An array of zero-based processor numbers to enable.
    content.vb: Public Shared Sub SetEnabledProcessors(process As Process, ParamArray enabledProcessorsNumbers As Integer())
  overload: Ploch.Common.Diagnostics.ProcessExtensions.SetEnabledProcessors*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown if <code class="paramref">process</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown if no processor numbers are specified.
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: >-
      Thrown if any processor number is negative, or not below the native affinity-mask width

      (<code>IntPtr.Size * 8</code> — 32 in a 32-bit process, 64 in a 64-bit process).
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      Thrown if the operating system did not enable every requested processor. Linux applies the intersection of the

      requested mask and the processors actually available to the process (see <code>sched_setaffinity(2)</code>), so a

      request mixing available and unavailable processors would otherwise succeed only partially and silently.
  nameWithType.vb: ProcessExtensions.SetEnabledProcessors(Process, ParamArray Integer())
  fullName.vb: Ploch.Common.Diagnostics.ProcessExtensions.SetEnabledProcessors(System.Diagnostics.Process, ParamArray Integer())
  name.vb: SetEnabledProcessors(Process, ParamArray Integer())
