    id: GetEnabledProcessors
    path: ../src/Common/Diagnostics/ProcessExtensions.cs
    startLine: 144
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Diagnostics
  summary: Gets the list of enabled processor numbers for the process based on its current affinity mask.
  remarks: >-
    Processor affinity is only supported on Windows and Linux; calling this on other platforms throws <xref href="System.PlatformNotSupportedException" data-throw-if-not-resolved="false"></xref>.


    <p>

    Every bit set in the native <xref href="System.Diagnostics.Process.ProcessorAffinity" data-throw-if-not-resolved="false"></xref> bitmask is reported — at most

    <code>IntPtr.Size * 8</code> processors (32 in a 32-bit process, 64 in a 64-bit process). The result is deliberately not

    limited by <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref>, which is a processor <i>count</i> rather than an index bound:

    a process constrained to a non-contiguous processor set (for example processors 8–15) reports exactly those

    processor numbers.

    </p>
  example: []
  syntax:
    content: public static IEnumerable<int> GetEnabledProcessors(this Process process)
    parameters:
    - id: process
      type: System.Diagnostics.Process
      description: The process to query.
    return:
      type: System.Collections.Generic.IEnumerable{System.Int32}
      description: An enumerable of zero-based processor numbers that are enabled for the process.
    content.vb: Public Shared Function GetEnabledProcessors(process As Process) As IEnumerable(Of Integer)
  overload: Ploch.Common.Diagnostics.ProcessExtensions.GetEnabledProcessors*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown if <code class="paramref">process</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
