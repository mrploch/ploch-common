    id: GetFlags
    path: ../src/Common/EnumHelper.cs
    startLine: 29
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Returns all enumeration flags of the specified value.
  remarks: >-
    Uses <xref href="System.Enum.HasFlag(System.Enum)" data-throw-if-not-resolved="false"></xref> to determine which flags are set and excludes the zero value.

    Useful for working with enums marked with the <xref href="System.FlagsAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public static IEnumerable<TEnum> GetFlags<TEnum>(this TEnum value) where TEnum : Enum'
    parameters:
    - id: value
      type: '{TEnum}'
      description: The enum value to extract flags from.
    typeParameters:
    - id: TEnum
      description: The enum type.
    return:
      type: System.Collections.Generic.IEnumerable{{TEnum}}
      description: A collection of all non-zero flags present in the given value.
    content.vb: Public Shared Function GetFlags(Of TEnum As [Enum])(value As TEnum) As IEnumerable(Of TEnum)
  overload: Ploch.Common.EnumHelper.GetFlags*
