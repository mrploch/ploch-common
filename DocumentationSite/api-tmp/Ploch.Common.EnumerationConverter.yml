  summary: Converts a string value to the specified enumeration type.
  example:
  - >-
    <pre><code class="lang-csharp">public enum Status { Active, Inactive, Pending }


    // Case-sensitive parsing

    Status status1 = "Active".ParseToEnum&lt;Status&gt;();


    // Case-insensitive parsing

    Status status2 = "active".ParseToEnum&lt;Status&gt;(ignoreCase: true);</code></pre>
  syntax:
    content: 'public static TEnum ParseToEnum<TEnum>(this string value, bool ignoreCase = false) where TEnum : struct, Enum'
    parameters:
