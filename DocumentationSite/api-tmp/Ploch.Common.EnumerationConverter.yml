  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Safely attempts to convert a string value to the specified enumeration type.
  example:
  - >-
    <pre><code class="lang-csharp">public enum Priority { Low, Medium, High }


    // Successful conversion

    Priority? priority1 = "Medium".SafeParseToEnum&lt;Priority&gt;();  // Returns Priority.Medium


    // Failed conversion returns null

    Priority? priority2 = "Critical".SafeParseToEnum&lt;Priority&gt;(); // Returns null


    // Null input returns null

    Priority? priority3 = null.SafeParseToEnum&lt;Priority&gt;();       // Returns null


    // Case-insensitive conversion

    Priority? priority4 = "high".SafeParseToEnum&lt;Priority&gt;(true); // Returns Priority.High</code></pre>
  syntax:
    content: 'public static TEnum? SafeParseToEnum<TEnum>(this string? value, bool ignoreCase = false) where TEnum : struct, Enum'
    parameters:
    - id: value
      type: System.String
      description: The string value to convert. Can be null or empty.
    - id: ignoreCase
      type: System.Boolean
      description: If true, ignores case when converting the string; otherwise, exact case matching is used. Default is false.
    typeParameters:
    - id: TEnum
      description: The enumeration type to convert to.
    return:
      type: System.Nullable{{TEnum}}
      description: The enumeration value that corresponds to the string value, or null if the conversion fails or the input is null or whitespace.
    content.vb: Public Shared Function SafeParseToEnum(Of TEnum As {Structure, [Enum]})(value As String, ignoreCase As Boolean = False) As TEnum?
