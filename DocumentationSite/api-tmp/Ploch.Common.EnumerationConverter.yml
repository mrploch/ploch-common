  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Converts an integer value to the specified enumeration type.
  remarks: >-
    This method converts the integer to a string and then uses the string-based ParseToEnum method.

    It will throw an exception if the integer value doesn't correspond to a defined value in the enum.
  example:
  - >-
    <pre><code class="lang-csharp">public enum Status { Active = 1, Inactive = 2, Pending = 3 }


    // Convert integer to enum

    Status status1 = 1.ParseToEnum&lt;Status&gt;();  // Returns Status.Active

    Status status2 = 2.ParseToEnum&lt;Status&gt;();  // Returns Status.Inactive


    // Using with integer variables

    int statusCode = GetStatusCodeFromDatabase();

    Status status = statusCode.ParseToEnum&lt;Status&gt;();


    // This would throw an ArgumentOutOfRangeException:

    // Status invalidStatus = 99.ParseToEnum&lt;Status&gt;();</code></pre>
  syntax:
    content: 'public static TEnum ParseToEnum<TEnum>(this int enumValue, IFormatProvider? formatProvider = null) where TEnum : struct, Enum'
    parameters:
    - id: enumValue
      type: System.Int32
      description: The integer value to convert to the enumeration.
    - id: formatProvider
      type: System.IFormatProvider
      description: An object that supplies culture-specific formatting information for the conversion. Default is null.
    typeParameters:
    - id: TEnum
      description: The enumeration type to convert to.
    return:
      type: '{TEnum}'
      description: The enumeration value that corresponds to the integer value.
    content.vb: Public Shared Function ParseToEnum(Of TEnum As {Structure, [Enum]})(enumValue As Integer, formatProvider As IFormatProvider = Nothing) As TEnum
