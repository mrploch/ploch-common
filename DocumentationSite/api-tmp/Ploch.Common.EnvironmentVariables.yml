  namespace: Ploch.Common
  summary: Retrieves the value of the specified environment variable as a boolean.
  example: []
  syntax:
    content: public static bool? GetBool(string variableName)
    parameters:
    - id: variableName
      type: System.String
      description: The name of the environment variable to retrieve.
    return:
      type: System.Nullable{System.Boolean}
      description: >-
        A nullable boolean containing the value of the environment variable if it can be successfully parsed as a boolean,

        or <code>null</code> if the environment variable is not found, not set, or cannot be parsed as a boolean.
