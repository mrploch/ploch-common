  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Retrieves the value of the specified environment variable and converts it to an enumeration of the specified type.
  example: []
  syntax:
    content: 'public static TEnum? GetEnumValue<TEnum>(string variableName, bool ignoreCase = true) where TEnum : struct, Enum'
    parameters:
    - id: variableName
      type: System.String
      description: The name of the environment variable to retrieve and convert.
    - id: ignoreCase
      type: System.Boolean
      description: A boolean value indicating whether the case of the environment variable value should be ignored during conversion. Defaults to <code>true</code>.
    typeParameters:
    - id: TEnum
      description: The enumeration type to which the environment variable value should be converted.
    return:
      type: System.Nullable{{TEnum}}
      description: >-
        An instance of the specified enumeration type if the environment variable value was successfully converted;

        otherwise, <code>null</code> if the environment variable value is not found or cannot be converted.
    content.vb: Public Shared Function GetEnumValue(Of TEnum As {Structure, [Enum]})(variableName As String, ignoreCase As Boolean = True) As TEnum?
