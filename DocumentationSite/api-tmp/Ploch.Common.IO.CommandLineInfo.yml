  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.IO
  summary: Gets the path to the executable file that was used to start the application.
  remarks: >-
    This property represents the full file path of the executable that initiated the process.

    It is commonly used to identify or verify the application being executed, particularly in scenarios

    where processes are being monitored, logged, or analyzed. The value may be null if the application path

    cannot be determined.
  example:
  - >-
    The following demonstrates how this property might be utilized:

    Suppose the command-line string is:

    <code>"C:\Test\Ploch.MyApp.exe" -arg1 value1</code>.

    In this case, the <code>ApplicationPath</code> property will return:

    <code>"C:\Test\Ploch.MyApp.exe"</code>.
  syntax:
    content: public string? ApplicationPath { get; }
    parameters: []
    return:
      type: System.String
      description: >-
        A <xref href="System.String" data-throw-if-not-resolved="false"></xref> containing the full path of the application executable, or <code>null</code>

        if the path is unavailable.
    content.vb: Public ReadOnly Property ApplicationPath As String
  overload: Ploch.Common.IO.CommandLineInfo.ApplicationPath*
