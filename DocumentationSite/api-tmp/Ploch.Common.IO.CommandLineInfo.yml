    id: Arguments
    path: ../src/Common/IO/CommandLineInfo.cs
    startLine: 58
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.IO
  summary: Gets the collection of arguments extracted from the command-line invocation.
  remarks: >-
    The property returns all command-line arguments passed to the application, excluding the path to the application itself.

    These arguments are typically used to modify the behavior or configuration of the application at runtime.

    The returned collection provides a structured way to access the arguments, making it easier for developers

    to process and utilize them within their application logic.
  example:
  - >-
    The following example demonstrates accessing the arguments property:

    Suppose the command-line string is:

    <code>"C:\Program Files\Ploch.MyApp\Ploch.MyApp.exe" -arg1 value1 -arg2 value2</code>.

    In this case:

    <code>ApplicationPath</code> will be <code>"C:\Program Files\Ploch.MyApp\Ploch.MyApp.exe"</code>,

    and the <code>Arguments</code> property will contain <code>["-arg1", "value1", "-arg2", "value2"]</code>.
  syntax:
    content: public IEnumerable<string> Arguments { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IEnumerable{System.String}
      description: >-
        An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> containing strings that represent the arguments supplied to the application.

        If no arguments were provided, the returned collection will be empty.
    content.vb: Public ReadOnly Property Arguments As IEnumerable(Of String)
  overload: Ploch.Common.IO.CommandLineInfo.Arguments*
