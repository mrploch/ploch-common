  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.IO
  summary: Appends or replaces the file extension of the specified path.
  example: []
  syntax:
    content: public static string WithExtension(this string path, string extension, bool replaceExistingExtension = true, StringComparison comparison = StringComparison.OrdinalIgnoreCase)
    parameters:
    - id: path
      type: System.String
      description: The file path for which the extension will be appended or replaced.
    - id: extension
      type: System.String
      description: >-
        The extension to append. This should include a leading dot (e.g., ".txt"). If the leading dot is omitted, it will be added

        automatically.
    - id: replaceExistingExtension
      type: System.Boolean
      description: Indicates whether to replace the existing file extension, if present. Defaults to <code>false</code>.
    - id: comparison
      type: System.StringComparison
      description: A <xref href="System.StringComparison" data-throw-if-not-resolved="false"></xref> value used for extension matching. Defaults to <code>StringComparison.OrdinalIgnoreCase</code>.
    return:
      type: System.String
      description: The modified file path with the specified extension appended or replaced.
    content.vb: Public Shared Function WithExtension(path As String, extension As String, replaceExistingExtension As Boolean = True, comparison As StringComparison = StringComparison.OrdinalIgnoreCase) As String
