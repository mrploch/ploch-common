    id: NormalizePathWithoutTrailingSeparator
    path: ../src/Common/IO/PathUtils.cs
    startLine: 79
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.IO
  summary: Normalizes the given path and removes any trailing directory separator characters.
  remarks: >-
    Besides removing the trailing directory separator, on a Windows platform, it would also normalize separators to the backslash,

    in case they are mixed in the path.

    For example, on Windows it would change:


    <pre><code class="lang-csharp">c:\mypath/somefolder\some-other-folder</code></pre>


    to:


    <pre><code class="lang-csharp">c:\mypath\somefolder\some-other-folder</code></pre>


    On a platform like macOS, forward slash (<code>/</code>) is a legal character in directory or file names, which means

    they would not be changed.
  example: []
  syntax:
    content: public static string NormalizePathWithoutTrailingSeparator(string path)
    parameters:
    - id: path
      type: System.String
      description: The path to normalize.
    return:
      type: System.String
      description: The normalized path without trailing directory separator characters.
    content.vb: Public Shared Function NormalizePathWithoutTrailingSeparator(path As String) As String
  overload: Ploch.Common.IO.PathUtils.NormalizePathWithoutTrailingSeparator*
  nameWithType.vb: PathUtils.NormalizePathWithoutTrailingSeparator(String)
  fullName.vb: Ploch.Common.IO.PathUtils.NormalizePathWithoutTrailingSeparator(String)
  name.vb: NormalizePathWithoutTrailingSeparator(String)
