  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Linq
  summary: Represents an interface for properties that belong to a specific instance of an object.
  remarks: >-
    <p>
        This interface provides abstract methods and properties for interacting with object properties
        at runtime in a strongly-typed manner. It encapsulates metadata about a property
        (<xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref>), the name of the property, and the instance that owns the property.
    </p>

    <p>
        This provides an API for retrieving and modifying property values, often used in dynamic object manipulation
        scenarios or when working with reflection.
    </p>
  example:
  - >-
    <p>
        The <code>IOwnedPropertyInfo</code> interface can be implemented to dynamically interact with object properties,
        for example, to modify property values at runtime based on their metadata.
    </p>
  syntax:
    content: 'public interface IOwnedPropertyInfo<TProperty> : IOwnedPropertyInfo'
    typeParameters:
    - id: TProperty
      description: The type of the property value.
    content.vb: Public Interface IOwnedPropertyInfo(Of TProperty) Inherits IOwnedPropertyInfo
