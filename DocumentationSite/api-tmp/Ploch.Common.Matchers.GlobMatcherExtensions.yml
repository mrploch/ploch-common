  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Matchers
  summary: Adds include patterns to the matcher from an enumerable collection, returning the same matcher provided to the method.
  remarks: >-
    This method is a simple shortcut to streamline the construction of the <xref href="Microsoft.Extensions.FileSystemGlobbing.Matcher" data-throw-if-not-resolved="false"></xref>. It allows include and exclude patterns

    to be added in a fluent manner, enabling method chaining, like in the example below.
  example:
  - <pre><code class="lang-csharp">var matcher = new Matcher(StringComparison.CurrentCulture).IncludePatterns(["*abc*", "def**"]).ExcludePatterns("**xyz*", "*ghi*");</code></pre>
  syntax:
    content: public static Matcher IncludePatterns(this Matcher matcher, IEnumerable<string> patterns)
    parameters:
    - id: matcher
      type: Microsoft.Extensions.FileSystemGlobbing.Matcher
      description: The matcher to add include patterns to.
    - id: patterns
      type: System.Collections.Generic.IEnumerable{System.String}
      description: The collection of glob patterns to include.
    return:
      type: Microsoft.Extensions.FileSystemGlobbing.Matcher
      description: The same matcher instance for method chaining.
    content.vb: Public Shared Function IncludePatterns(matcher As Matcher, patterns As IEnumerable(Of String)) As Matcher
  overload: Ploch.Common.Matchers.GlobMatcherExtensions.IncludePatterns*
