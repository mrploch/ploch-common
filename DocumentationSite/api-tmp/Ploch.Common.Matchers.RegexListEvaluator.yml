  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Matchers
  summary: Determines whether the specified string matches any of the regular expressions in the collection.
  remarks: >-
    If the input string is null, the method returns the value of <code>nullValueMatchResult</code>.

    Otherwise, it checks if the string matches any of the compiled regular expressions.
  example: []
  syntax:
    content: public bool IsMatch(string? value)
    parameters:
    - id: value
      type: System.String
      description: The string to match against the regular expressions.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if the string matches any of the regular expressions; if value is null then the value of <code>nullValueMatchResult</code>; otherwise,

        <code>false</code>.
    content.vb: Public Function IsMatch(value As String) As Boolean
