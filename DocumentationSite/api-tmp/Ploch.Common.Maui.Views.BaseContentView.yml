  - Ploch.Common.Maui
  namespace: Ploch.Common.Maui.Views
  summary: Base class for content views that are driven by an <xref href="Ploch.Lists.UI.MauiUI.ViewModels.IViewModel" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Setting <xref href="Ploch.Common.Maui.Views.BaseContentView.ViewModel" data-throw-if-not-resolved="false"></xref> also assigns it as the view's <code>BindingContext</code>.

    <xref href="Ploch.Lists.UI.MauiUI.ViewModels.IViewModel.OnAppearingAsync" data-throw-if-not-resolved="false"></xref> is invoked the first time the view renders, and again when a

    <em>different</em> view model is assigned to a view that has already appeared — so a model assigned late

    still receives its first appearance, while reassigning the same instance does not notify it twice.
  example: []
  syntax:
    content: 'public abstract class BaseContentView : ContentView, INotifyPropertyChanged, IEffectControlProvider, IToolTipElement, IContextFlyoutElement, IAnimatable, IViewController, IVisualElementController, IElementController, IGestureController, IGestureRecognizers, IPropertyMapperView, IHotReloadableView, IReplaceableView, ILayout, ILayoutController, IVisualTreeElement, IContentView, IView, IElement, ITransform, IPadding, ICrossPlatformLayout, IView'
