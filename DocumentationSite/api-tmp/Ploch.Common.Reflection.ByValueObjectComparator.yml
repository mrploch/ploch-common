  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Determines whether two objects are equal by comparing their property values recursively.
  example: []
  syntax:
    content: public static bool AreEqual(object? x, object? y, Type? type = null)
    parameters:
    - id: x
      type: System.Object
      description: The first object to compare.
    - id: y
      type: System.Object
      description: The second object to compare.
    - id: type
      type: System.Type
      description: The type to use for property comparison. If null, the type of the first object will be used.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if both objects are null or if all their property values are equal;

        <code>false</code> if only one object is null or if any of their property values differ.
    content.vb: Public Shared Function AreEqual(x As Object, y As Object, type As Type = Nothing) As Boolean
