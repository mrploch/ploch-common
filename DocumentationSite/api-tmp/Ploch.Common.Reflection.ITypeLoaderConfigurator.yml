  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Configures the type loader to include or exclude abstract types during type-loading operations.
  example: []
  syntax:
    content: ITypeLoaderConfigurator IncludeAbstractTypes(bool include = true)
    parameters:
    - id: include
      type: System.Boolean
      description: >-
        A boolean value indicating whether abstract types should be included in the results.

        When set to <code>true</code>, abstract types will be included; otherwise, they will be excluded.

        Default is <code>true</code>.
    return:
      type: Ploch.Common.Reflection.ITypeLoaderConfigurator
      description: The current <xref href="Ploch.Common.Reflection.ITypeLoaderConfigurator" data-throw-if-not-resolved="false"></xref> instance for method chaining.
