  namespace: Ploch.Common.Reflection
  summary: Configures the type loader to include the specified base types when loading types.
  example: []
  syntax:
    content: ITypeLoaderConfigurator WithBaseTypes(params Type[] baseTypes)
    parameters:
    - id: baseTypes
      type: System.Type[]
      description: >-
        An array of base types or interfaces to be used as filters for type-loading operations.

        At least one base type must be provided.
    return:
      type: Ploch.Common.Reflection.ITypeLoaderConfigurator
      description: The current instance of <xref href="Ploch.Common.Reflection.ITypeLoaderConfigurator" data-throw-if-not-resolved="false"></xref> to allow for method chaining of type-loading configurations.
