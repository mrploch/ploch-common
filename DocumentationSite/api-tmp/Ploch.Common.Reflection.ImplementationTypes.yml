  namespace: Ploch.Common.Reflection
  summary: Gets all types from the assembly containing the specified type that implement or inherit from the specified base type.
  example: []
  syntax:
    content: public static IEnumerable<Type> GetTypesImplementing(this Type assemblyType, Type baseType, bool includeAbstract = false)
    parameters:
    - id: assemblyType
      type: System.Type
      description: The type whose assembly will be searched for implementations.
    - id: baseType
      type: System.Type
      description: The base type or interface to find implementations of.
    - id: includeAbstract
      type: System.Boolean
      description: When true, abstract types are included in the results; otherwise, only concrete types are returned. Default is false.
    return:
      type: System.Collections.Generic.IEnumerable{System.Type}
      description: An enumerable collection of types that implement or inherit from the specified base type.
    content.vb: Public Shared Function GetTypesImplementing(assemblyType As Type, baseType As Type, includeAbstract As Boolean = False) As IEnumerable(Of Type)
