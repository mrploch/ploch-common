  namespace: Ploch.Common.Reflection
  summary: >-
    Computes a hash code for the specified object, considering its internal state and values.

    The method inspects readable, non-indexed properties and processes sequences, while supporting cyclic references

    to avoid infinite recursion. If the object is <code>null</code>, this method returns <code>0</code>.
  example: []
  syntax:
    content: public static int GetHashCode(object? obj)
    parameters:
    - id: obj
      type: System.Object
      description: The object for which the hash code should be calculated. Can be <code>null</code>.
    return:
      type: System.Int32
      description: An integer representing the computed hash code for the given object.
    content.vb: Public Shared Function GetHashCode(obj As Object) As Integer
