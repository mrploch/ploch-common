    id: GetMemberValues
    path: ../src/Common/Reflection/ObjectReflectionExtensions.cs
    startLine: 119
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Retrieves the values of specified member types (fields and/or properties) from an object or type.
  example: []
  syntax:
    content: public static IDictionary<string, object?> GetMemberValues<TType>(this TType? obj, BindingFlags bindingFlags = BindingFlags.Instance | BindingFlags.Public, MemberTypes memberTypes = MemberTypes.Field | MemberTypes.Property, Type? reflectedType = null)
    parameters:
    - id: obj
      type: '{TType}'
      description: The object from which to retrieve member values. If null, retrieves only static members from the type.
    - id: bindingFlags
      type: System.Reflection.BindingFlags
      description: >-
        The binding flags that control the visibility and scope of members to retrieve. Defaults to

        <xref href="System.Reflection.BindingFlags.Instance" data-throw-if-not-resolved="false"></xref> | <xref href="System.Reflection.BindingFlags.Public" data-throw-if-not-resolved="false"></xref>.
    - id: memberTypes
      type: System.Reflection.MemberTypes
      description: >-
        The types of members to retrieve, such as fields and/or properties. Defaults to

        <xref href="System.Reflection.MemberTypes.Field" data-throw-if-not-resolved="false"></xref> | <xref href="System.Reflection.MemberTypes.Property" data-throw-if-not-resolved="false"></xref>.
    - id: reflectedType
      type: System.Type
      description: The type to use for reflection instead of deriving the type from the object. If null, uses the object's runtime type.
    typeParameters:
    - id: TType
      description: The type of the object to retrieve member values from.
    return:
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: A dictionary where the keys are the names of the members and the values are the values of the members.
    content.vb: Public Shared Function GetMemberValues(Of TType)(obj As TType, bindingFlags As BindingFlags = BindingFlags.Instance Or BindingFlags.Public, memberTypes As MemberTypes = MemberTypes.Field Or MemberTypes.Property, reflectedType As Type = Nothing) As IDictionary(Of String, Object)
  overload: Ploch.Common.Reflection.ObjectReflectionExtensions.GetMemberValues*
  nameWithType.vb: ObjectReflectionExtensions.GetMemberValues(Of TType)(TType, BindingFlags, MemberTypes, Type)
  fullName.vb: Ploch.Common.Reflection.ObjectReflectionExtensions.GetMemberValues(Of TType)(TType, System.Reflection.BindingFlags, System.Reflection.MemberTypes, System.Type)
  name.vb: GetMemberValues(Of TType)(TType, BindingFlags, MemberTypes, Type)
