  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Retrieves the values of all fields from an object or type.
  example: []
  syntax:
    content: public static IDictionary<string, object?> GetFieldValues<TType>(this TType? obj, BindingFlags bindingFlags = BindingFlags.Instance | BindingFlags.Public)
    parameters:
    - id: obj
      type: '{TType}'
      description: The object from which to retrieve field values. If null, retrieves only static fields from the type.
    - id: bindingFlags
      type: System.Reflection.BindingFlags
      description: >-
        A combination of <xref href="System.Reflection.BindingFlags" data-throw-if-not-resolved="false"></xref> that specifies how the search for fields is conducted.

        By default, the search is performed for instance and public fields.
    typeParameters:
    - id: TType
      description: The type of the object whose fields are to be retrieved.
    return:
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: A dictionary where each key is the field name, and each value is the corresponding field value.
    content.vb: Public Shared Function GetFieldValues(Of TType)(obj As TType, bindingFlags As BindingFlags = BindingFlags.Instance Or BindingFlags.Public) As IDictionary(Of String, Object)
