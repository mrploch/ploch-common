  summary: Retrieves all static field values of a specified type, including non-public members.
  example: []
  syntax:
    content: public static IDictionary<string, object?> GetMemberValues<TType>(BindingFlags bindingFlags = BindingFlags.Instance | BindingFlags.Public, MemberTypes memberTypes = MemberTypes.Field | MemberTypes.Property)
    parameters:
    - id: bindingFlags
      type: System.Reflection.BindingFlags
      description: >-
        A combination of <xref href="System.Reflection.BindingFlags" data-throw-if-not-resolved="false"></xref> that specifies how the search for fields is conducted.

        By default, the search is performed for public fields.
    - id: memberTypes
      type: System.Reflection.MemberTypes
