    id: ValidatePropertyInfoForGetValue
    path: ../src/Common/Reflection/PropertyAccessValidators.cs
    startLine: 42
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Validates if a given <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> represents a property that can be read and optionally validates index parameters if applicable.
  remarks: >-
    This method checks the validity of a property for the purpose of retrieving its value.

    It ensures that the property exists, is readable, and, for indexed properties, that the provided index arguments match the expectations.
  example:
  - >-
    The following example demonstrates how to use <xref href="Ploch.Common.Reflection.PropertyAccessValidators.ValidatePropertyInfoForGetValue(System.Reflection.PropertyInfo%2cSystem.String%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> to validate a property:


    <pre><code class="lang-csharp">// Example setup

    var propertyInfo = typeof(SomeClass).GetProperty("SomeProperty");

    object[]? indexValues = null; // Set this if dealing with indexed properties

    // Validation

    try

    {

    PropertyAccessValidators.ValidatePropertyInfoForGetValue(propertyInfo, "SomeProperty", indexValues);

    Console.WriteLine("Property is valid for reading.");

    }

    catch (Exception ex)

    {

    Console.WriteLine($"Validation failed: {ex.Message}");

    }</code></pre>
  syntax:
    content: public static void ValidatePropertyInfoForGetValue(PropertyInfo? propertyInfo, string propertyName, object?[]? index = null)
    parameters:
    - id: propertyInfo
      type: System.Reflection.PropertyInfo
      description: The <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> instance representing the property to validate. May be null.
    - id: propertyName
      type: System.String
      description: The name of the property being validated. Used for exception messages if <code class="paramref">propertyInfo</code> is null.
    - id: index
      type: System.Object[]
      description: An optional array of values to match the expected index parameters for indexed properties.
    content.vb: Public Shared Sub ValidatePropertyInfoForGetValue(propertyInfo As PropertyInfo, propertyName As String, index As Object() = Nothing)
  overload: Ploch.Common.Reflection.PropertyAccessValidators.ValidatePropertyInfoForGetValue*
  exceptions:
  - type: Ploch.Common.Reflection.PropertyNotFoundException
    commentId: T:Ploch.Common.Reflection.PropertyNotFoundException
    description: Thrown when <code class="paramref">propertyInfo</code> is null.
  - type: Ploch.Common.Reflection.PropertyWriteOnlyException
    commentId: T:Ploch.Common.Reflection.PropertyWriteOnlyException
    description: Thrown when the property is write-only and cannot be read.
  - type: Ploch.Common.Reflection.PropertyIndexerMismatchException
    commentId: T:Ploch.Common.Reflection.PropertyIndexerMismatchException
    description: Thrown when the property is an indexed property but no index values are provided, or when the provided index values do not match the expected types.
