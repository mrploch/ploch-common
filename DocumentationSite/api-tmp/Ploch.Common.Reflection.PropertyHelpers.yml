  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Gets all property names and their values from the specified object.
  remarks: >-
    This method uses reflection to retrieve all public properties of the object's type

    and returns their names paired with their current values. Properties that cannot

    be read or throw exceptions during value retrieval may cause this method to fail.
  example:
  - >-
    <pre><code class="lang-csharp">var person = new { Name = "John", Age = 30, City = "New York" };

    var propertyValues = person.GetPropertyValues();


    foreach (var (name, value) in propertyValues)

    {
        Console.WriteLine($"{name}: {value}");
    }

    // Output:

    // Name: John

    // Age: 30

    // City: New York</code></pre>
  syntax:
    content: public static IEnumerable<(string Name, object? Value)> GetPropertyValues(this object obj)
    parameters:
    - id: obj
      type: System.Object
      description: The object from which to retrieve property values.
    return:
      type: System.Collections.Generic.IEnumerable{System.ValueTuple{System.String,System.Object}}
      description: >-
        An enumerable collection of tuples containing property names and their corresponding values.

        Each tuple contains the property name as a string and the property value as an object (which may be null).
    content.vb: Public Shared Function GetPropertyValues(obj As Object) As IEnumerable(Of (Name As String, Value As Object))
  overload: Ploch.Common.Reflection.PropertyHelpers.GetPropertyValues*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">obj</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  nameWithType.vb: PropertyHelpers.GetPropertyValues(Object)
  fullName.vb: Ploch.Common.Reflection.PropertyHelpers.GetPropertyValues(Object)
  name.vb: GetPropertyValues(Object)
