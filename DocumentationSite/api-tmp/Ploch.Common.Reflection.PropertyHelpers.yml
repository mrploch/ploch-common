  namespace: Ploch.Common.Reflection
  summary: >-
    Retrieves public properties of a specified object based on a set of property types,

    optionally including assignable or inherited types.
  example: []
  syntax:
    content: public static IEnumerable<PropertyInfo> GetProperties(this object obj, bool includeAssignableOrInheritedTypes, params Type[] propertyTypes)
    parameters:
    - id: obj
      type: System.Object
