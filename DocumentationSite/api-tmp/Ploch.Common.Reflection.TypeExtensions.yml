    <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref>, or a nullable version of a simple type.
  example: []
  syntax:
    content: public static bool IsSimpleType(this Type type)
    parameters:
    - id: type
      type: System.Type
      description: The type to evaluate.
    return:
