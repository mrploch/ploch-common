    id: GetStaticFieldValues
    path: ../src/Common/Reflection/TypeHelper.cs
    startLine: 21
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.Reflection
  summary: Retrieves the values of all static fields for the specified type.
  example: []
  syntax:
    content: public static IDictionary<string, object?> GetStaticFieldValues<TType>(BindingFlags bindingFlags = BindingFlags.Public)
    parameters:
    - id: bindingFlags
      type: System.Reflection.BindingFlags
      description: >-
        A combination of <xref href="System.Reflection.BindingFlags" data-throw-if-not-resolved="false"></xref> that specifies how the search for fields is conducted.

        By default, public static fields are retrieved.
    typeParameters:
    - id: TType
      description: The type whose static field values are to be retrieved.
    return:
      type: System.Collections.Generic.IDictionary{System.String,System.Object}
      description: A dictionary where the key represents the name of the static field, and the value represents the value of the field.
    content.vb: Public Shared Function GetStaticFieldValues(Of TType)(bindingFlags As BindingFlags = BindingFlags.Public) As IDictionary(Of String, Object)
