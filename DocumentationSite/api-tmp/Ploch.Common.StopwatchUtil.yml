  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Measures the time it takes for a task to complete.
  example:
  - >-
    <pre><code class="lang-csharp">// Example 1: Measure an existing Task

    // Assume this code is inside an async method

    Task work = Task.Delay(500);

    TimeSpan elapsed = await StopwatchUtil.TimeAsync(work);

    Console.WriteLine($"Work took {elapsed.TotalMilliseconds} ms");


    // Example 2: Measure an operation created inline

    TimeSpan inlineElapsed = await StopwatchUtil.TimeAsync(Task.Run(async () =&gt;

    {
        await Task.Delay(250);
        // do some work here...
    }));

    Console.WriteLine($"Inline work took {inlineElapsed.TotalMilliseconds} ms");</code></pre>
  syntax:
    content: public static Task<TimeSpan> TimeAsync(Task task)
    parameters:
    - id: task
      type: System.Threading.Tasks.Task
      description: The task to measure the time for.
    return:
      type: System.Threading.Tasks.Task{System.TimeSpan}
      description: The time elapsed for the task to complete.
    content.vb: Public Shared Function TimeAsync(task As Task) As Task(Of TimeSpan)
  overload: Ploch.Common.StopwatchUtil.TimeAsync*
