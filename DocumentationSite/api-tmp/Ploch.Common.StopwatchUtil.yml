  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Measures the time it takes to execute the specified asynchronous action.
  example:
  - >-
    <pre><code class="lang-csharp">// Example: Measure the execution time of an asynchronous method

    // This is a synchronous call that blocks until the async operation completes

    TimeSpan elapsed = StopwatchUtil.Time(async () =&gt;

    {
        await Task.Delay(500);
        // do some work here...
    });

    Console.WriteLine($"Operation took {elapsed.TotalMilliseconds} ms");


    // Example: Measuring an existing async method

    async Task SomeAsyncOperation()

    {
        await Task.Delay(250);
        // do some work here...
    }


    TimeSpan methodElapsed = StopwatchUtil.Time(SomeAsyncOperation);

    Console.WriteLine($"Method took {methodElapsed.TotalMilliseconds} ms");</code></pre>
  syntax:
    content: public static Task<TimeSpan> TimeAsync(Func<Task> asyncAction)
    parameters:
    - id: asyncAction
      type: System.Func{System.Threading.Tasks.Task}
      description: The asynchronous action to measure the time for.
    return:
      type: System.Threading.Tasks.Task{System.TimeSpan}
      description: The time elapsed for the action to complete.
    content.vb: Public Shared Function TimeAsync(asyncAction As Func(Of Task)) As Task(Of TimeSpan)
