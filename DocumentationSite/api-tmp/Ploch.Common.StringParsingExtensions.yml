  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Attempts to parse the specified string as a 64-bit signed integer.
  example: []
  syntax:
    content: public static long? ParseToInt64(this string? str)
    parameters:
    - id: str
      type: System.String
      description: The string to parse. Can be <code>null</code>, empty, or consist of only whitespace.
    return:
      type: System.Nullable{System.Int64}
      description: >-
        A nullable <code>long</code> representing the parsed value. Returns the parsed 64-bit integer if parsing is successful.

        Returns <code>null</code> if the string is <code>null</code>, whitespace, or cannot be parsed as a valid 64-bit integer (e.g., due to invalid format or overflow).
    content.vb: Public Shared Function ParseToInt64(str As String) As Long?
