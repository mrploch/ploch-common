  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Attempts to parse the specified string as a boolean value.
  example: []
  syntax:
    content: public static bool? ParseToBool(this string? str)
    parameters:
    - id: str
      type: System.String
      description: The string to parse. Can be <code>null</code> or whitespace.
    return:
      type: System.Nullable{System.Boolean}
      description: >-
        A nullable boolean that represents the parsed value. Returns <code>true</code> or <code>false</code> if parsing is successful.

        Returns <code>null</code> if the string is <code>null</code>, whitespace, or cannot be parsed as a valid boolean value.
    content.vb: Public Shared Function ParseToBool(str As String) As Boolean?
