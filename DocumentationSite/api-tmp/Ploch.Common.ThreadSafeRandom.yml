    path: ../src/Common/ThreadSafeRandom.cs
    startLine: 27
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common
  summary: Gets the shared instance of the random number generator.
  remarks: >-
    This property provides a thread-safe way to access a shared instance of the <xref href="System.Random" data-throw-if-not-resolved="false"></xref> class.

    The first time this property is accessed from a thread, it creates a new instance of <xref href="System.Random" data-throw-if-not-resolved="false"></xref>

    with a seed generated from the global <xref href="System.Random" data-throw-if-not-resolved="false"></xref> instance. Subsequent accesses on the same

    thread will return the same instance, maintaining the same sequence of random numbers.
  example: []
  syntax:
    content: public static Random Shared { get; }
    parameters: []
    return:
      type: System.Random
      description: The shared instance of the random number generator.
    content.vb: Public Shared ReadOnly Property [Shared] As Random
  overload: Ploch.Common.ThreadSafeRandom.Shared*
