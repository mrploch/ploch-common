  namespace: Ploch.Common.TypeConversion
  summary: Determines whether case-sensitive comparison should be used based on the CaseSensitivity value.
  example: []
  syntax:
    content: public static bool IsCaseSensitive(this CaseSensitivity caseSensitivity, bool caseSensitiveDefault)
    parameters:
    - id: caseSensitivity
      type: Ploch.Common.TypeConversion.CaseSensitivity
      description: The case sensitivity setting to evaluate.
    - id: caseSensitiveDefault
      type: System.Boolean
      description: The default value to use when case sensitivity is unspecified.
    return:
      type: System.Boolean
      description: >-
        <code>true</code> if comparisons should be case-sensitive;

        <code>false</code> if comparisons should be case-insensitive.

        For <xref href="Ploch.Common.TypeConversion.CaseSensitivity.Unspecified" data-throw-if-not-resolved="false"></xref>, returns the value of <code class="paramref">caseSensitiveDefault</code>.
    content.vb: Public Shared Function IsCaseSensitive(caseSensitivity As CaseSensitivity, caseSensitiveDefault As Boolean) As Boolean
