  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: >-
    Converts a string value to a nullable enumeration type based on the specified target type.

    This method attempts to map the string value to an enumeration field within the specified target type.
  example: []
  syntax:
    content: protected override ValueType? DoConvert(string? value, Type targetType)
    parameters:
    - id: value
      type: System.String
      description: The string value to be converted. Can be null.
    - id: targetType
      type: System.Type
      description: The target type to which the value should be converted. Must be a nullable enumeration type.
    return:
      type: System.ValueType
      description: Returns a nullable enumeration value if the conversion is successful; otherwise, null.
    content.vb: Protected Overrides Function DoConvert(value As String, targetType As Type) As ValueType
