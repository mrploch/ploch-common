  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: >-
    Determines whether the target type can be handled.

    This method checks if the base implementation can handle the target type

    and additionally verifies whether the type or its underlying nullable type is an enum.
  example: []
  syntax:
    content: public override bool CanHandleTargetType(Type targetType)
    parameters:
    - id: targetType
      type: System.Type
      description: The target type to be checked.
    return:
      type: System.Boolean
      description: Returns true if the target type can be handled and is an enumeration type; otherwise, false.
