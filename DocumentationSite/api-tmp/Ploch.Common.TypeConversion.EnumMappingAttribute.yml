    id: IncludeActualEnumName
    path: ../src/Common/TypeConversion/EnumMappingAttribute.cs
    startLine: 133
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: >-
    Gets or sets a value indicating whether the actual enumeration field name

    should be included in the mapping alongside additional mappings defined

    through the <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.IncludeActualEnumName" data-throw-if-not-resolved="false"></xref> property determines if the enumeration's

    original name should be added to the list of available mappings within

    <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute" data-throw-if-not-resolved="false"></xref>. When set to <code>true</code>,

    the actual enum name is appended to the names list used for WMI object lookups or

    other mapping purposes.
  example:
  - >-
    The <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.IncludeActualEnumName" data-throw-if-not-resolved="false"></xref> property can be used in scenarios where

    both custom names and the original enum names need to be part of WMI-related

    mappings. For example, if the custom attribute specifies additional WMI mappings

    and <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.IncludeActualEnumName" data-throw-if-not-resolved="false"></xref> is <code>true</code>, the enum field itself can

    also be used to map or match corresponding WMI data.
  syntax:
    content: public bool IncludeActualEnumName { get; set; }
    parameters: []
    return:
      type: System.Boolean
      description: >-
        A <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref> indicating whether the enumeration field name is included

        in the mapping. Defaults to <code>false</code>.
    content.vb: Public Property IncludeActualEnumName As Boolean
  overload: Ploch.Common.TypeConversion.EnumMappingAttribute.IncludeActualEnumName*
