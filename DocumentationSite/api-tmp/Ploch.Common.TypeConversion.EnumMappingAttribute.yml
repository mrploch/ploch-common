  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: >-
    Gets the collection of string values that represent the mapping of

    the enumeration field to different WMI object names.
  remarks: >-
    The <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.Names" data-throw-if-not-resolved="false"></xref> property provides a list of names or mappings

    associated with the enumeration field. These names can be provided

    via the <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute" data-throw-if-not-resolved="false"></xref> attribute

    and are typically used for resolving or matching WMI data.
  example:
  - >-
    The <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.Names" data-throw-if-not-resolved="false"></xref> property can be accessed to retrieve all the WMI object mappings

    for a particular enumeration field. These mappings may include additional or alternate

    names that correspond to the enumeration value when querying management objects.
  syntax:
    content: public IEnumerable<string?> Names { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IEnumerable{System.String}
      description: An <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> of nullable strings representing the mapped names.
    content.vb: Public ReadOnly Property Names As IEnumerable(Of String)
