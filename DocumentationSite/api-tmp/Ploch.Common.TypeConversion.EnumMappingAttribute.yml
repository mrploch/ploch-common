    path: ../src/Common/TypeConversion/EnumMappingAttribute.cs
    startLine: 107
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: >-
    Gets or sets a value indicating whether string comparisons for this mapping

    are treated as case-sensitive.
  remarks: >-
    The <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.CaseSensitive" data-throw-if-not-resolved="false"></xref> property determines whether the mapping of

    enumeration fields to WMI object names should respect case in string comparisons.

    When set to <code>true</code>, string matching will enforce case-sensitive rules; otherwise,

    comparisons are case-insensitive by default.
  example:
  - >-
    Use the <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute.CaseSensitive" data-throw-if-not-resolved="false"></xref> property to control whether enumeration

    mappings should consider case sensitivity in name matching.
  syntax:
    content: public CaseSensitivity CaseSensitive { get; set; }
    parameters: []
    return:
      type: Ploch.Common.TypeConversion.CaseSensitivity
      description: >-
        A <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref> that is <code>true</code> if the string comparisons are

        case-sensitive; otherwise, <code>false</code>.
    content.vb: Public Property CaseSensitive As CaseSensitivity
  overload: Ploch.Common.TypeConversion.EnumMappingAttribute.CaseSensitive*
