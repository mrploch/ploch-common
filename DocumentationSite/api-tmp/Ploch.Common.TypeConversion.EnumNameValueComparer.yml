  summary: Provides equality comparison for instances of <xref href="Ploch.Common.TypeConversion.EnumName" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This comparer is designed to compare <xref href="Ploch.Common.TypeConversion.EnumName" data-throw-if-not-resolved="false"></xref> instances using both the name

    and the case-sensitivity configuration. It evaluates equality based on the string value

    of the name and whether the comparison is case-sensitive or not.
