    id: GetEnumFieldValueMap
    path: ../src/Common/TypeConversion/EnumerationMapExtractor.cs
    startLine: 35
  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: Retrieves a mapping of enumeration field names to their corresponding values for the specified enumeration type.
  remarks: >-
    The <xref href="Ploch.Common.TypeConversion.EnumConversionAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="Ploch.Common.TypeConversion.EnumMappingAttribute" data-throw-if-not-resolved="false"></xref> allow to control how

    string names are mapped to enum values.
  example: []
  syntax:
    content: public static IDictionary<EnumName, object> GetEnumFieldValueMap(Type enumType)
    parameters:
    - id: enumType
      type: System.Type
      description: >-
        The enumeration type for which to create the mapping of field names to values. This parameter must be of type <xref href="System.Type" data-throw-if-not-resolved="false"></xref> and must

        represent

        an enumeration.
    return:
      type: System.Collections.Generic.IDictionary{Ploch.Common.TypeConversion.EnumName,System.Object}
      description: A dictionary where the keys are the string names of the enumeration fields, and the values are the corresponding enumeration values.
    content.vb: Public Shared Function GetEnumFieldValueMap(enumType As Type) As IDictionary(Of EnumName, Object)
  overload: Ploch.Common.TypeConversion.EnumerationMapExtractor.GetEnumFieldValueMap*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when <code class="paramref">enumType</code> is not an enumeration type.
