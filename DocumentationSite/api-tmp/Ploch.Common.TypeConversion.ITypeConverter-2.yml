  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: Converts a value from the source type to the target type specified, considering additional type-handling rules.
  example: []
  syntax:
    content: TTargetType? ConvertValue(TSourceType? value, Type targetType)
    parameters:
    - id: value
      type: '{TSourceType}'
      description: >-
        The value of type <code class="typeparamref">TSourceType</code> to be converted. This value can be null,

        in which case the method will handle null values according to the converter's configuration.
    - id: targetType
      type: System.Type
      description: >-
        The target type to which the value should be converted. The method ensures compatibility

        between the source value and the specified target type before performing the conversion.
    return:
      type: '{TTargetType}'
      description: >-
        An instance of <code class="typeparamref">TTargetType</code>, or null if the value is null and the converter is configured to handle null values.

        If the conversion is not possible, an exception is thrown.
    content.vb: Function ConvertValue(value As TSourceType, targetType As Type) As TTargetType
