  namespace: Ploch.Common.TypeConversion
  summary: >-
    Defines a generic interface for type conversion between a specified source type and target type.

    This interface enables converting values from the source type to the target type,

    as well as providing the ability to specify alternative target types during conversion operations.
  example: []
  syntax:
    content: 'public interface ITypeConverter<TSourceType, TTargetType> : ISourceTypeConverter<TSourceType>, ITargetTypeConverter<TTargetType>, ITypeConverter'
    typeParameters:
    - id: TSourceType
      description: The type of the source value that will be converted.
    - id: TTargetType
      description: The type of the target value to which the source type will be converted.
    content.vb: Public Interface ITypeConverter(Of TSourceType, TTargetType) Inherits ISourceTypeConverter(Of TSourceType), ITargetTypeConverter(Of TTargetType), ITypeConverter
