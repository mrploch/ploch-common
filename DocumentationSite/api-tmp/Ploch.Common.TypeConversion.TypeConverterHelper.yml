  assemblies:
  - Ploch.Common
  namespace: Ploch.Common.TypeConversion
  summary: Determines whether a converter can handle a specific type based on type compatibility.
  example: []
  syntax:
    content: public static bool CanHandleType(bool canHandleDerivedValue, Type type, Type actualType)
    parameters:
    - id: canHandleDerivedValue
      type: System.Boolean
      description: If true, derived types are considered compatible with the base type.
    - id: type
      type: System.Type
      description: The type that the converter is designed to handle.
    - id: actualType
      type: System.Type
      description: The actual type to check compatibility with.
    return:
      type: System.Boolean
      description: >-
        True if the actual type is exactly the same as the specified type, or if derived types are allowed

        and the actual type is derived from or implements the specified type; otherwise, false.
    content.vb: Public Shared Function CanHandleType(canHandleDerivedValue As Boolean, type As Type, actualType As Type) As Boolean
