  summary: >-
    Represents a handler for processing a specific type of endpoint operation. The interface is generic over both

    the request type and the response type, allowing for flexible use across different endpoint implementations.
  example: []
  syntax:
    content: public interface IEndpointHandler<in TRequest, TResponse>
    typeParameters:
    - id: TRequest
      description: The type of the request object to be handled by the endpoint.
    - id: TResponse
      description: The type of the response object returned by the endpoint.
