  assemblies:
  - Ploch.Common.WebApi
  namespace: Ploch.Common.WebApi
  summary: Registers the built-in OpenAPI document provider together with Swagger generation for a single API version.
  example:
  - >-
    <pre><code class="lang-csharp">builder.Services.ConfigureOpenApiOptions(new OpenApiInfo
                                             {
                                                 Title = "Orders API",
                                                 Version = "v1"
                                             });</code></pre>
  syntax:
    content: public static IServiceCollection ConfigureOpenApiOptions(this IServiceCollection services, OpenApiInfo apiDescription, string apiVersionString = "v1")
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the OpenAPI services to.
    - id: apiDescription
      type: Microsoft.OpenApi.OpenApiInfo
      description: The document metadata (title, version, description, contact, licence) published for the API.
    - id: apiVersionString
      type: System.String
      description: The document name the generated Swagger document is registered under. Defaults to <code>v1</code>.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The same <code class="paramref">services</code> instance, so further calls can be chained.
    content.vb: Public Shared Function ConfigureOpenApiOptions(services As IServiceCollection, apiDescription As OpenApiInfo, apiVersionString As String = "v1") As IServiceCollection
  overload: Ploch.Common.WebApi.OpenApiConfigurator.ConfigureOpenApiOptions*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: >-
      Thrown when <code class="paramref">services</code>, <code class="paramref">apiDescription</code> or

      <code class="paramref">apiVersionString</code> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when <code class="paramref">apiVersionString</code> is empty.
