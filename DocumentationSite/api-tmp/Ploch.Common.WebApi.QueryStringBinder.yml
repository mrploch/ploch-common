  namespace: Ploch.Common.WebApi
  summary: Binds HTTP query string parameters from the given HttpContext to a new instance of the specified type.
  example: []
  syntax:
    content: 'public static TQuery Bind<TQuery>(HttpContext httpContext) where TQuery : new()'
    parameters:
    - id: httpContext
      type: Microsoft.AspNetCore.Http.HttpContext
      description: The HTTP context containing the query string parameters to bind.
    typeParameters:
    - id: TQuery
      description: The type to which the query string parameters will be bound. Must have a parameterless constructor.
    return:
      type: '{TQuery}'
      description: An instance of type <code class="typeparamref">TQuery</code> populated with values from the query string.
    content.vb: Public Shared Function Bind(Of TQuery As New)(httpContext As HttpContext) As TQuery
  overload: Ploch.Common.WebApi.QueryStringBinder.Bind*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: Thrown when a property of type <code class="typeparamref">TQuery</code> has a type that is not supported for query string binding.
  - type: System.FormatException
    commentId: T:System.FormatException
    description: Thrown when a query string value cannot be converted to its target property type.
