  assemblies:
  - Ploch.Common.WebApi
  namespace: Ploch.Common.WebApi
  summary: Attempts to parse the specified query string parameters into an instance of the given type.
  example: []
  syntax:
    content: 'public static bool TryParse<TQuery>(IDictionary<string, StringValues> query, out TQuery queryInstance) where TQuery : new()'
    parameters:
    - id: query
      type: System.Collections.Generic.IDictionary{System.String,Microsoft.Extensions.Primitives.StringValues}
      description: A dictionary containing the query string parameters, using the property names as keys.
    - id: queryInstance
      type: '{TQuery}'
      description: >-
        When this method returns, contains an instance of type <code class="typeparamref">TQuery</code>

        populated with the values from the query string if parsing was successful, or the default value if parsing failed.
    typeParameters:
    - id: TQuery
      description: The type into which the query string parameters will be parsed. Must have a parameterless constructor.
    return:
      type: System.Boolean
      description: True if the query string parameters were successfully parsed into an instance of <code class="typeparamref">TQuery</code>; otherwise, false.
    content.vb: Public Shared Function TryParse(Of TQuery As New)(query As IDictionary(Of String, StringValues), queryInstance As TQuery) As Boolean
  overload: Ploch.Common.WebApi.QueryStringBinder.TryParse*
  exceptions:
  - type: System.FormatException
    commentId: T:System.FormatException
    description: >-
      Thrown when a query string value cannot be converted to its target property type. A <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>

      return value means the type itself is not bindable; a malformed <em>value</em> for an otherwise supported type

      is reported as an exception naming the property and the expected type.
  nameWithType.vb: QueryStringBinder.TryParse(Of TQuery)(IDictionary(Of String, StringValues), TQuery)
  fullName.vb: Ploch.Common.WebApi.QueryStringBinder.TryParse(Of TQuery)(System.Collections.Generic.IDictionary(Of String, Microsoft.Extensions.Primitives.StringValues), TQuery)
  name.vb: TryParse(Of TQuery)(IDictionary(Of String, StringValues), TQuery)
