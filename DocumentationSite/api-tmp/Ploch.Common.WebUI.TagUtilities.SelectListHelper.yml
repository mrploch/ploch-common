  summary: Creates a list of <xref href="Microsoft.AspNetCore.Mvc.Rendering.SelectListItem" data-throw-if-not-resolved="false"></xref> from the <code class="paramref">items</code> collection.
  remarks: >-
    Maps items from the <code class="paramref">items</code> to <xref href="Microsoft.AspNetCore.Mvc.Rendering.SelectListItem" data-throw-if-not-resolved="false"></xref> using the

    <code class="paramref">textFunc</code> and

    <code class="paramref">valueFunc</code> functions.
  example: []
  syntax:
    content: public static IList<SelectListItem> CreateFor<TModel>(IEnumerable<TModel> items, Func<TModel, object> textFunc, Func<TModel, object> valueFunc, bool includeNull = false, string nullText = "--- Select ---")
    parameters:
    - id: items
      type: System.Collections.Generic.IEnumerable{{TModel}}
      description: The source collection.
    - id: textFunc
      type: System.Func{{TModel},System.Object}
      description: >-
        Function mapping an item to the <xref href="Microsoft.AspNetCore.Mvc.Rendering.SelectListItem.Text" data-throw-if-not-resolved="false"></xref> property of a

