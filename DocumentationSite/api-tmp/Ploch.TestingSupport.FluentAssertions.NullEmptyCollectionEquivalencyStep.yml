  assemblies:
  - Ploch.TestingSupport.FluentAssertions
  namespace: Ploch.TestingSupport.FluentAssertions
  summary: >-
    An <xref href="FluentAssertions.Equivalency.IEquivalencyStep" data-throw-if-not-resolved="false"></xref> that treats a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> collection

    as equivalent to an empty collection (and vice versa).
  remarks: >-
    <p>
        This step is useful when comparing object graphs where one side may have left a
        collection property uninitialised (<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>) while the other has
        initialised it to an empty collection. A common scenario is EF Core entities: a
        navigation collection that was not eager-loaded via <code>Include()</code> remains
        <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, whereas in-memory test entities typically initialise it
        to <code>new List&lt;T&gt;()</code>. Without this step, FluentAssertions treats the two
        as different, producing false-negative assertion failures.
    </p>

    <p>
        The step only intercedes when one side is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> and the other is
        an empty <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref> (excluding <xref href="System.String" data-throw-if-not-resolved="false"></xref>, which also
        implements <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref>). All other cases are passed through to the
        next step in the pipeline, preserving configured options such as
        <xref href="System.DateTimeOffset" data-throw-if-not-resolved="false"></xref> tolerance and cyclic-reference handling.
    </p>

    <p>
        Register the step via <code>options.Using(new NullEmptyCollectionEquivalencyStep())</code>
        when calling <code>Should().BeEquivalentTo(...)</code>.
    </p>
  example:
  - >-
    <pre><code class="lang-csharp">var actual = new Parent { Children = null };

    var expected = new Parent { Children = new List&lt;Child&gt;() };


    actual.Should().BeEquivalentTo(expected,
        options =&gt; options.Using(new NullEmptyCollectionEquivalencyStep()));</code></pre>
  syntax:
