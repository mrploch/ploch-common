  summary: >-
    An AutoFixture <xref href="AutoFixture.ICustomization" data-throw-if-not-resolved="false"></xref> that removes the default

    <xref href="AutoFixture.ThrowingRecursionBehavior" data-throw-if-not-resolved="false"></xref> so that recursive object graphs do not

    immediately cause an exception during specimen creation.
  remarks: >-
    This customization is typically paired with <xref href="Ploch.TestingSupport.XUnit3.AutoMoq.OmitOnRecursionCustomization" data-throw-if-not-resolved="false"></xref>

    to omit recursive branches instead of throwing.
